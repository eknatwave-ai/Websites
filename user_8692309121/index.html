<style>

#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);gap:6px}

try{best=parseInt(localStorage.getItem('ab_best')||'0',10)||0;}catch(e){best=0;}

/* ============ AUDIO ============ */
var AC=null,soundOn=true;
function initAudio(){
  if(AC)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(C)AC=new C();
  }catch(e){AC=null;}
}
function tone(freq,dur,type,vol,slideTo){
  if(!soundOn||!AC)return;
  try{
    var t0=AC.currentTime;
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t0);o.stop(t0+dur+0.03);
  }catch(e){}
}
function noiseBurst(dur,vol,freq){
  if(!soundOn||!AC)return;
  try{
    var n=Math.floor(AC.sampleRate*dur);
    if(n<1)return;
    var buf=AC.createBuffer(1,n,AC.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var s=AC.createBufferSource();s.buffer=buf;
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1400;
    var g=AC.createGain();g.gain.value=vol||0.2;
    s.connect(f);f.connect(g);g.connect(AC.destination);
    s.start();
  }catch(e){}
}
function sfxLaunch(){tone(560,0.16,'sawtooth',0.09,140);}

function sfxPop(){tone(700,0.10,'square',0.10,240);tone(980,0.14,'sine',0.07,320);}
function sfxBoom(){noiseBurst(0.45,0.32,900);tone(140,0.4,'sine',0.18,40);}
function sfxAbility(){tone(420,0.18,'triangle',0.12,1100);}
function sfxWin(){var f=[523,659,784,1047];for(var i=0;i<f.length;i++)setTimeout((function(fr){return function(){tone(fr,0.22,'triangle',0.12);};})(f[i]),i*95);}

/* ============ BIRD DEFS ============ */
var BIRD_DEFS={

/* ============ LEVELS ============ */
/* block: [type, cx, yBottom, w, h]  pig: [type, cx, yBottom] */

 {birds:['red','red','red','red'],

 {birds:['red','red','blue'],

 {birds:['red','yellow','red'],

 {birds:['yellow','blue','red','red'],

  p:[['n',36,0],['n',108,0],['n',72,175],['n',-35,0],['n',182,0]]},

 {birds:['black','red','blue','red'],
  b:[['s',0,0,20,90],['s',72,0,20,90],['s',144,0,20,90],['s',216,0,20,90],
     ['w',108,90,260,20],

 {birds:['white','yellow','blue','red','red'],

/* ============ RESIZE ============ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SCALE=Math.min(W/1280,H/720);
  SCALE=Math.max(0.55,Math.min(SCALE,1.5));
  slingX=slingXPos();
  slingY=slingYPos();
}

/* ============ HELPERS ============ */
function dmgFromSpeed(sp){return Math.max(0.4,(sp/SCALE)/100);}

function spawnParticle(x,y,color,count,power){
  count=count||1;
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2;
    var sp=(Math.random()*0.7+0.3)*(power||300);
    particles.push({
      x:x,y:y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp-70,
      life:0.6,maxLife:0.6,
      color:color,
      size:(Math.random()*3.4+1.8)*SCALE
    });
  }
  if(particles.length>320)particles.splice(0,particles.length-320);
}
function popup(x,y,text,color){
  popups.push({x:x,y:y,text:text,color:color||'#ffd54a',life:1.0,vy:-58});
}
function queueExplosion(x,y,radius,power){explodeQueue.push({x:x,y:y,r:radius,p:power});}

function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.vy+=G*0.55*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x-cameraX,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function updatePopups(dt){
  for(var i=popups.length-1;i>=0;i--){
    var p=popups[i];
    p.y+=p.vy*dt;
    p.vy*=0.94;
    p.life-=dt;
    if(p.life<=0)popups.splice(i,1);
  }
}
function drawPopups(){
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for(var i=0;i<popups.length;i++){
    var p=popups[i];
    ctx.globalAlpha=Math.min(1,p.life*1.6);
    ctx.font='900 '+Math.round(17*SCALE+6)+'px system-ui,sans-serif';
    ctx.lineWidth=4;
    ctx.strokeStyle='rgba(0,0,0,.65)';
    ctx.strokeText(p.text,p.x-cameraX,p.y);
    ctx.fillStyle=p.color;
    ctx.fillText(p.text,p.x-cameraX,p.y);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
}

/* ============ BIRD ============ */
function Bird(x,y,type){
  var d=BIRD_DEFS[type]||BIRD_DEFS.red;
  this.type=type||'red';
  this.def=d;
  this.x=x;this.y=y;
  this.vx=0;this.vy=0;
  this.r=d.r*SCALE;
  this.launched=false;this.dead=false;
  this.trail=[];
  this.rot=0;this.rotSpeed=0;
  this.age=0;this.restTime=0;
  this.abilityUsed=false;
  this.fuse=-1;
  this.hitSomething=false;
}
Bird.prototype.update=function(dt){
  if(this.dead)return;
  this.age+=dt;
  if(!this.launched)return;
  this.vy+=G*dt;
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  this.rot+=this.rotSpeed*dt;

  this.trail.push({x:this.x,y:this.y,a:1});
  if(this.trail.length>30)this.trail.shift();
  for(var i=0;i<this.trail.length;i++)this.trail[i].a-=dt*1.5;

  if(this.fuse>=0){
    this.fuse-=dt;
    if(this.fuse<=0){
      this.fuse=-1;
      this.dead=true;
      queueExplosion(this.x,this.y,145*SCALE,72);
      return;
    }
  }

  var gy=groundY()-this.r;
  if(this.y>gy){
    if(this.vy>420*SCALE)spawnParticle(this.x,gy,'#c9a06a',5,260);
    this.y=gy;
    this.vy*=-0.35;
    this.vx*=0.72;
    if(Math.abs(this.vy)<50*SCALE){this.vy=0;this.rotSpeed=0;}
  }

  if(this.y>=gy-1&&Math.abs(this.vx)<30*SCALE&&Math.abs(this.vy)<20*SCALE){
    this.restTime+=dt;
    if(this.restTime>0.4)this.dead=true;
  }else{
    this.restTime=0;
  }

  if(this.x>W+900||this.x<-900||this.y>H+900)this.dead=true;
  if(this.age>16)this.dead=true;
};
Bird.prototype.activate=function(){
  if(this.abilityUsed||!this.launched||this.dead)return false;
  var t=this.type;
  var sp=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
  if(t==='yellow'){
    if(sp<60*SCALE)return false;
    this.abilityUsed=true;
    this.vx*=2.5;this.vy*=2.5;
    spawnParticle(this.x,this.y,'#ffd60a',14,420);
    spawnParticle(this.x,this.y,'#fff3a0',8,300);
    sfxAbility();
    return true;
  }
  if(t==='blue'){
    if(sp<60*SCALE)return false;
    this.abilityUsed=true;
    var a=Math.atan2(this.vy,this.vx);
    for(var k=-1;k<=1;k+=2){
      var ang=a+k*0.3;
      var nb=new Bird(this.x,this.y,'blue');
      nb.launched=true;
      nb.abilityUsed=true;
      nb.vx=Math.cos(ang)*sp*0.95;
      nb.vy=Math.sin(ang)*sp*0.95;
      nb.rotSpeed=this.rotSpeed;
      birds.push(nb);
    }
    spawnParticle(this.x,this.y,'#4cc9f0',12,320);
    sfxAbility();
    return true;
  }
  if(t==='black'){
    this.abilityUsed=true;
    this.dead=true;
    queueExplosion(this.x,this.y,150*SCALE,78);
    return true;
  }
  if(t==='white'){
    this.abilityUsed=true;
    bombs.push({
      x:this.x,y:this.y+this.r*0.8,
      vx:this.vx*0.25,vy:this.vy*0.25+140*SCALE,
      r:9*SCALE,timer:1.2,dead:false
    });
    this.vx*=0.55;
    this.vy=-Math.abs(this.vy)*0.85-340*SCALE;
    sfxAbility();
    return true;
  }
  return false;
};
Bird.prototype.draw=function(){
  if(this.dead)return;
  var r=this.r,d=this.def,i,t;
  for(i=0;i<this.trail.length;i++){
    t=this.trail[i];
    if(t.a<=0)continue;
    ctx.fillStyle='rgba(255,255,255,'+(t.a*0.28)+')';
    ctx.beginPath();
    ctx.arc(t.x-cameraX,t.y,Math.max(1,r*0.4*t.a),0,Math.PI*2);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(this.x-cameraX,this.y);
  ctx.rotate(this.rot);
  var grd=ctx.createRadialGradient(-r*0.3,-r*0.35,2,0,0,r*1.15);
  grd.addColorStop(0,d.light);
  grd.addColorStop(1,d.color);
  ctx.fillStyle=grd;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=d.dark;
  ctx.lineWidth=Math.max(1,2*SCALE);
  ctx.stroke();

  ctx.fillStyle='#ffe8b0';
  ctx.beginPath();ctx.ellipse(0,r*0.38,r*0.5,r*0.34,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(r*0.25,-r*0.35,r*0.33,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-r*0.15,-r*0.35,r*0.29,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(r*0.32,-r*0.35,r*0.13,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-r*0.08,-r*0.35,r*0.12,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#111';
  ctx.lineWidth=Math.max(2,3*SCALE);
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(r*0.05,-r*0.72);ctx.lineTo(r*0.52,-r*0.52);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*0.42,-r*0.68);ctx.lineTo(-r*0.04,-r*0.56);ctx.stroke();

  ctx.fillStyle='#ffa94d';
  ctx.beginPath();
  ctx.moveTo(r*0.52,r*0.02);
  ctx.lineTo(r*1.05,r*0.14);
  ctx.lineTo(r*0.52,r*0.32);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#e8590c';
  ctx.lineWidth=Math.max(1,1.4*SCALE);
  ctx.stroke();

  ctx.fillStyle=d.dark;
  ctx.beginPath();
  ctx.moveTo(-r*0.85,-r*0.18);
  ctx.lineTo(-r*1.45,-r*0.48);
  ctx.lineTo(-r*1.32,r*0.22);
  ctx.closePath();ctx.fill();

  if(this.type==='black'){
    ctx.strokeStyle='#ffb703';
    ctx.lineWidth=Math.max(2,2.6*SCALE);
    ctx.beginPath();ctx.arc(0,-r*0.9,r*0.3,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
    if(this.fuse>=0){
      ctx.fillStyle='rgba(255,90,0,'+(0.4+0.5*Math.abs(Math.sin(this.age*40)))+')';
      ctx.beginPath();ctx.arc(0,-r*1.15,r*0.28,0,Math.PI*2);ctx.fill();
    }
  }
  if(this.type==='white'){
    ctx.fillStyle='#e63946';
    ctx.beginPath();
    ctx.moveTo(-r*0.2,-r*0.95);
    ctx.lineTo(r*0.2,-r*0.95);
    ctx.lineTo(r*0.1,-r*0.62);
    ctx.lineTo(-r*0.1,-r*0.62);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
};

/* ============ PIG ============ */
function Pig(x,y,type){
  var d=PIG_DEFS[type]||PIG_DEFS.n;
  this.type=type||'n';
  this.def=d;
  this.x=x;this.y=y;
  this.r=d.r*SCALE;
  this.dead=false;
  this.hp=d.hp*SCALE;
  this.maxHp=this.hp;
  this.hurt=0;
  this.vx=0;this.vy=0;
  this.settled=true;
}
Pig.prototype.update=function(dt){
  if(this.dead)return;
  if(this.hurt>0)this.hurt-=dt;
  if(this.settled){this.vx=0;this.vy=0;return;}
  this.vy+=G*dt;
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  var gy=groundY()-this.r;
  if(this.y>gy){
    var impact=Math.abs(this.vy);
    this.y=gy;
    this.vy=0;
    this.vx*=0.7;
    if(impact>520*SCALE)this.hit(dmgFromSpeed(impact)*0.7);
    if(Math.abs(this.vx)<20*SCALE){this.vx=0;this.settled=true;}
  }
  if(!this.dead&&(this.x<-400||this.x>W+900||this.y>H+900))this.dead=true;
};
Pig.prototype.hit=function(dmg){
  if(this.dead||dmg<=0)return;
  this.hp-=dmg*(1/SCALE);
  this.hurt=0.3;
  this.settled=false;
  if(this.hp<=0){
    this.dead=true;
    score+=this.def.score;
    updateHUD();
    popup(this.x,this.y-this.r,'+'+this.def.score,'#a5d8a5');
    spawnParticle(this.x,this.y,'#a5d8a5',12,340);
    spawnParticle(this.x,this.y,'#e9ffd8',8,260);
    sfxPop();
  }else{
    sfxHit();
  }
};
Pig.prototype.draw=function(){
  if(this.dead)return;
  var r=this.r;
  ctx.save();
  ctx.translate(this.x-cameraX,this.y);
  var grd=ctx.createRadialGradient(-r*0.3,-r*0.3,2,0,0,r*1.1);
  if(this.hurt>0){grd.addColorStop(0,'#ffd0d0');grd.addColorStop(1,'#ff6b6b');}
  else{grd.addColorStop(0,'#b4e6b4');grd.addColorStop(1,'#3f8f3f');}
  ctx.fillStyle=grd;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2d6a2d';
  ctx.lineWidth=Math.max(1,2*SCALE);
  ctx.stroke();

  ctx.fillStyle=this.hurt>0?'#ff9b9b':'#4a9e4a';
  ctx.beginPath();ctx.arc(-r*0.6,-r*0.78,r*0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.6,-r*0.78,r*0.3,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=this.hurt>0?'#ffc9c9':'#7bc47b';
  ctx.beginPath();ctx.ellipse(0,r*0.16,r*0.56,r*0.43,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2d6a2d';
  ctx.lineWidth=Math.max(1,1.4*SCALE);
  ctx.stroke();
  ctx.fillStyle='#2d6a2d';
  ctx.beginPath();ctx.ellipse(-r*0.19,r*0.16,r*0.08,r*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(r*0.19,r*0.16,r*0.08,r*0.12,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-r*0.35,-r*0.22,r*0.23,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.35,-r*0.22,r*0.23,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.22,r*0.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.4,-r*0.22,r*0.1,0,Math.PI*2);ctx.fill();

  if(this.def.helmet){
    ctx.fillStyle='#8d99ae';
    ctx.beginPath();
    ctx.arc(0,-r*0.35,r*0.95,Math.PI*1.08,Math.PI*1.92);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#5c6672';
    ctx.lineWidth=Math.max(1,2*SCALE);
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.ellipse(-r*0.3,-r*0.72,r*0.22,r*0.1,-0.4,0,Math.PI*2);
    ctx.fill();
  }
  var hpFrac=Math.max(0,this.hp/this.maxHp);
  if(hpFrac<1&&hpFrac>0){
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.fillRect(-r*0.6,r*1.05,r*1.2,r*0.16);
    ctx.fillStyle=hpFrac>0.5?'#55d455':(hpFrac>0.25?'#ffd54a':'#ff6b6b');
    ctx.fillRect(-r*0.6,r*1.05,r*1.2*hpFrac,r*0.16);

};

/* ============ BLOCK ============ */
var BLOCK_HP={w:20,i:10,s:40,t:6};
var BLOCK_SCORE={w:50,i:40,s:100,t:150};
function Block(x,y,w,h,type){
  this.x=x;this.y=y;
  this.w=w;this.h=h;
  this.type=type||'w';
  this.vx=0;this.vy=0;
  this.rot=0;this.rotSpeed=0;
  this.dead=false;
  this.hp=BLOCK_HP[this.type]||20;
  this.maxHp=this.hp;
  this.settled=true;
}
Block.prototype.update=function(dt){
  if(this.dead)return;
  if(this.settled){this.vx=0;this.vy=0;this.rotSpeed=0;return;}
  this.vy+=G*dt;
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  this.rot+=this.rotSpeed*dt;
  var gy=groundY()-this.h/2;
  if(this.y>gy){
    var impact=Math.abs(this.vy);
    this.y=gy;
    this.vy=0;
    this.vx*=0.5;
    this.rotSpeed*=0.3;
    if(Math.abs(this.vx)<25*SCALE&&Math.abs(this.rotSpeed)<0.6){
      this.vx=0;this.rotSpeed=0;
      this.rot=Math.round(this.rot/(Math.PI/2))*(Math.PI/2);
      this.settled=true;
    }
    if(impact>480*SCALE&&!this.dead){
      this.hit(dmgFromSpeed(impact)*1.6);
    }
  }
  if(!this.dead&&(this.x<-500||this.x>W+1000||this.y>H+900))this.dead=true;
};
Block.prototype.hit=function(dmg){
  if(this.dead||dmg<=0)return;
  this.hp-=dmg;
  if(this.hp<=0){
    this.dead=true;
    score+=BLOCK_SCORE[this.type]||50;
    updateHUD();
    if(this.type==='t'){
      queueExplosion(this.x,this.y,120*SCALE,62);
    }else{
      var col=this.type==='i'?'#b4dcff':(this.type==='s'?'#cfd6dd':'#c98a4b');
      spawnParticle(this.x,this.y,col,9,300);
      sfxBuild();
    }
  }
};
Block.prototype.draw=function(){
  if(this.dead)return;
  ctx.save();
  ctx.translate(this.x-cameraX,this.y);
  ctx.rotate(this.rot);
  var w=this.w,h=this.h;
  var fill,stroke;
  if(this.type==='w'){fill='#c98a4b';stroke='#8b5a2b';}
  else if(this.type==='s'){fill='#9aa5b1';stroke='#5c6672';}
  else if(this.type==='i'){fill='rgba(180,220,255,.85)';stroke='#7ab8e8';}
  else{fill='#d64545';stroke='#8b1a1a';}
  ctx.fillStyle=fill;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle=stroke;
  ctx.lineWidth=Math.max(1,2*SCALE);
  ctx.strokeRect(-w/2,-h/2,w,h);

  if(this.type==='w'){
    ctx.strokeStyle='rgba(139,90,43,.45)';
    ctx.lineWidth=1;
    for(var i=1;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(-w/2,-h/2+i*h/3);
      ctx.lineTo(w/2,-h/2+i*h/3);
      ctx.stroke();
    }
  }
  if(this.type==='i'){
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillRect(-w/2+2,-h/2+2,Math.max(1,w*0.22),Math.max(2,h*0.55));
  }
  if(this.type==='t'){
    ctx.fillStyle='#ffd54a';
    for(var k=-1;k<=1;k+=2){
      ctx.fillRect(-w/2,k*h*0.22-2,w,4);
    }
    ctx.fillStyle='#fff';
    ctx.font='900 '+Math.max(9,Math.round(w*0.34))+'px system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('TNT',0,0);
    ctx.textAlign='left';
    ctx.textBaseline='alphabetic';
  }
  var frac=this.hp/this.maxHp;
  if(frac<0.66){
    ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.lineWidth=Math.max(1,1.4*SCALE);
    ctx.beginPath();
    ctx.moveTo(-w*0.3,-h*0.35);
    ctx.lineTo(-w*0.05,-h*0.05);
    ctx.lineTo(-w*0.25,h*0.18);
    ctx.lineTo(w*0.1,h*0.4);
    ctx.stroke();
    if(frac<0.33){
      ctx.beginPath();
      ctx.moveTo(w*0.34,-h*0.4);
      ctx.lineTo(w*0.08,-h*0.1);
      ctx.lineTo(w*0.3,h*0.3);
      ctx.stroke();
    }
  }
  ctx.restore();
};

/* ============ EXPLOSION ============ */
function explode(x,y,radius,power){
  shake=Math.max(shake,14*SCALE+8);
  sfxBoom();
  for(var i=0;i<26;i++){
    var a=Math.random()*Math.PI*2;
    var sp=(Math.random()*0.75+0.35)*power*3.4;
    particles.push({
      x:x,y:y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90*SCALE,
      life:0.75,maxLife:0.75,
      color:Math.random()<0.5?'#ffb703':(Math.random()<0.5?'#ff6b00':'#ffd54a'),
      size:(Math.random()*4.5+2)*SCALE
    });
  }
  var b,i2;
  for(i2=0;i2<blocks.length;i2++){
    b=blocks[i2];
    if(b.dead)continue;
    var dx=b.x-x,dy=b.y-y;
    var dd=Math.sqrt(dx*dx+dy*dy);
    var reach=radius+b.w*0.5;
    if(dd<reach){
      var f=1-dd/reach;
      b.hit(power*f*1.4);
      if(!b.dead){
        var dl=dd||1;
        b.vx+=dx/dl*power*f*4;
        b.vy+=dy/dl*power*f*4-120*SCALE;
        b.rotSpeed+=(Math.random()-0.5)*8;
        b.settled=false;
      }
    }
  }
  for(i2=0;i2<pigs.length;i2++){
    var p=pigs[i2];
    if(p.dead)continue;
    var dx2=p.x-x,dy2=p.y-y;
    var dd2=Math.sqrt(dx2*dx2+dy2*dy2);
    var reach2=radius+p.r;
    if(dd2<reach2){
      var f2=1-dd2/reach2;
      p.hit(power*f2*1.8);
      if(!p.dead){
        var dl2=dd2||1;
        p.vx+=dx2/dl2*power*f2*5;
        p.vy+=dy2/dl2*power*f2*5-220*SCALE;
        p.settled=false;
      }
    }
  }
  for(i2=0;i2<bombs.length;i2++){
    var bm=bombs[i2];
    if(bm.dead)continue;
    var dx3=bm.x-x,dy3=bm.y-y;
    if(dx3*dx3+dy3*dy3<radius*radius)bm.timer=0.05;
  }
}
function processExplosions(){
  var guard=0;
  while(explodeQueue.length&&guard<40){
    guard++;
    var e=explodeQueue.shift();
    explode(e.x,e.y,e.r,e.p);
  }
  explodeQueue.length=0;
}

/* ============ BOMBS (white bird egg) ============ */
function updateBombs(dt){
  for(var i=bombs.length-1;i>=0;i--){
    var b=bombs[i];
    if(b.dead){bombs.splice(i,1);continue;}
    b.vy+=G*dt;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.timer-=dt;
    var gy=groundY()-b.r;
    if(b.y>=gy||b.timer<=0){
      b.dead=true;
      queueExplosion(b.x,Math.min(b.y,gy),110*SCALE,58);
      bombs.splice(i,1);
    }
  }
}
function drawBombs(){
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i];
    ctx.save();
    ctx.translate(b.x-cameraX,b.y);
    ctx.fillStyle='#f8f9fa';
    ctx.beginPath();ctx.ellipse(0,0,b.r*0.85,b.r*1.15,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#adb5bd';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }
}

/* ============ COLLISIONS ============ */
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  var lx=cx-rx,ly=cy-ry;
  var closestX=Math.max(-rw/2,Math.min(rw/2,lx));
  var closestY=Math.max(-rh/2,Math.min(rh/2,ly));
  var dx=lx-closestX,dy=ly-closestY;
  return dx*dx+dy*dy<cr*cr;
}

function resolveBlockBlocks(){
  for(var i=0;i<blocks.length;i++){
    var a=blocks[i];
    if(a.dead||a.settled)continue;
    for(var j=0;j<blocks.length;j++){
      var b=blocks[j];
      if(b===a||b.dead)continue;
      var halfW=(a.w+b.w)/2;
      var halfH=(a.h+b.h)/2;
      var dx=a.x-b.x,dy=a.y-b.y;
      if(Math.abs(dx)<halfW&&Math.abs(dy)<halfH){
        var px=halfW-Math.abs(dx);
        var py=halfH-Math.abs(dy);
        if(py<=px){
          a.y=dy<0?b.y-halfH:b.y+halfH;
          if(dy<0){if(a.vy>0)a.vy=0;}
          else{if(a.vy<0)a.vy=0;}
          a.vx*=0.5;
          if(Math.abs(a.vx)<25*SCALE){
            a.vx=0;a.vy=0;a.rotSpeed=0;a.settled=true;
          }
          if(Math.abs(a.vy)>380*SCALE){
            a.hit(dmgFromSpeed(Math.abs(a.vy))*0.9);
            if(!b.dead&&b.hp>0)b.hit(dmgFromSpeed(Math.abs(a.vy))*0.5);
          }
        }else{
          a.x=dx<0?b.x-halfW:b.x+halfW;
          a.vx*=-0.3;
        }
      }
    }
  }
}

function updateSupport(){
  var g=groundY();
  var tol=10*SCALE;
  var i,j;
  for(i=0;i<blocks.length;i++){
    var a=blocks[i];
    if(a.dead||!a.settled)continue;
    var bottom=a.y+a.h/2;
    if(bottom>=g-2)continue;
    var ok=false;
    for(j=0;j<blocks.length;j++){
      var b=blocks[j];
      if(b===a||b.dead)continue;
      var top=b.y-b.h/2;
      if(Math.abs(bottom-top)<tol&&Math.abs(a.x-b.x)<(a.w+b.w)/2){ok=true;break;}
    }
    if(!ok)a.settled=false;
  }
  for(i=0;i<pigs.length;i++){
    var p=pigs[i];
    if(p.dead||!p.settled)continue;
    var pb=p.y+p.r;
    if(pb>=g-2)continue;
    var okp=false;
    for(j=0;j<blocks.length;j++){
      var bb=blocks[j];
      if(bb.dead)continue;
      var t2=bb.y-bb.h/2;
      if(Math.abs(pb-t2)<tol&&Math.abs(p.x-bb.x)<(p.r+bb.w/2)){okp=true;break;}
    }
    if(!okp)p.settled=false;
  }
}

function resolveCollisions(){
  var i,j;
  for(i=0;i<birds.length;i++){
    var bd=birds[i];
    if(!bd.launched||bd.dead)continue;
    var speed=Math.sqrt(bd.vx*bd.vx+bd.vy*bd.vy);

    for(j=0;j<pigs.length;j++){
      var p=pigs[j];
      if(p.dead)continue;
      var dx=bd.x-p.x,dy=bd.y-p.y;
      var d=Math.sqrt(dx*dx+dy*dy);
      var minD=bd.r+p.r;
      if(d<minD){
        var nx=d>0?dx/d:1,ny=d>0?dy/d:0;
        if(!bd.hitSomething){
          bd.hitSomething=true;
          if(bd.type==='black'&&!bd.abilityUsed&&bd.fuse<0)bd.fuse=0.12;
        }
        if(speed>150*SCALE){
          p.hit(dmgFromSpeed(speed)*1.15);
          spawnParticle(p.x,p.y,'#a5d8a5',7,280);
        }
        if(!p.dead){
          p.vx=nx*speed*0.5;
          p.vy=ny*speed*0.3-140*SCALE;
          p.settled=false;
        }
        bd.vx*=0.5;bd.vy*=0.5;
        bd.x=p.x+nx*minD;
        bd.y=p.y+ny*minD;
      }
    }

    for(j=0;j<blocks.length;j++){
      var bl=blocks[j];
      if(bl.dead)continue;
      if(circleRect(bd.x,bd.y,bd.r,bl.x,bl.y,bl.w,bl.h)){
        if(!bd.hitSomething){
          bd.hitSomething=true;
          if(bd.type==='black'&&!bd.abilityUsed&&bd.fuse<0)bd.fuse=0.12;
        }
        if(speed>200*SCALE){
          bl.hit(Math.min(48,dmgFromSpeed(speed)));
          var bx=bd.x-bl.x,by=bd.y-bl.y;
          var bl2=Math.sqrt(bx*bx+by*by)||1;
          if(!bl.dead){
            bl.vx=(bx/bl2)*speed*0.42;
            bl.vy=(by/bl2)*speed*0.42;
            bl.rotSpeed=(Math.random()-0.5)*6;
            bl.settled=false;
          }
          spawnParticle(bl.x,bl.y,bl.type==='i'?'#b4dcff':(bl.type==='s'?'#cfd6dd':'#c98a4b'),5,260);
          sfxHit();
        }
        bd.vx*=0.66;
        bd.vy*=0.66;
        bd.rotSpeed*=0.5;
      }
    }

    for(j=0;j<bombs.length;j++){
      var bm=bombs[j];
      if(bm.dead)continue;
      var bdx=bd.x-bm.x,bdy=bd.y-bm.y;
      if(bdx*bdx+bdy*bdy<(bd.r+bm.r)*(bd.r+bm.r))bm.timer=0.05;
    }
  }

  for(i=0;i<blocks.length;i++){
    var bk=blocks[i];
    if(bk.dead||bk.settled)continue;
    var sp=Math.sqrt(bk.vx*bk.vx+bk.vy*bk.vy);
    if(sp<120*SCALE)continue;
    for(j=0;j<pigs.length;j++){
      var pg=pigs[j];
      if(pg.dead)continue;
      if(Math.abs(bk.x-pg.x)<(bk.w/2+pg.r)&&Math.abs(bk.y-pg.y)<(bk.h/2+pg.r)){
        pg.hit(dmgFromSpeed(sp)*0.95);
        if(!pg.dead){
          pg.vx=bk.vx*0.5;
          pg.vy=bk.vy*0.3-120*SCALE;
          pg.settled=false;
        }
      }
    }
  }
}

function physicsStep(dt){
  var i;
  for(i=0;i<birds.length;i++)birds[i].update(dt);
  for(i=0;i<pigs.length;i++)pigs[i].update(dt);
  for(i=0;i<blocks.length;i++)blocks[i].update(dt);
  updateBombs(dt);
  updateSupport();
  resolveBlockBlocks();
  resolveCollisions();
  processExplosions();
}

/* ============ LEVEL ============ */
function clearEndTimer(){endTimer=0;endAction='';}

function setupLevel(){
  clearEndTimer();
  birds=[];pigs=[];blocks=[];particles=[];popups=[];bombs=[];explodeQueue=[];
  currentBird=null;dragging=false;
  cameraX=0;cameraTarget=0;shake=0;acc=0;
  hideHint();

  var S=SCALE,G0=groundY();
  slingX=slingXPos();
  slingY=slingYPos();
  var base=levelBaseX();
  var L=LEVELS[(level-1)%LEVELS.length];
  if(!L)L=LEVELS[0];

  birdQueue=L.birds.slice();

  var i;
  for(i=0;i<L.b.length;i++){
    var bd=L.b[i];
    var w=bd[3]*S,h=bd[4]*S;
    blocks.push(new Block(base+bd[1]*S,G0-bd[2]*S-h/2,w,h,bd[0]));
  }
  for(i=0;i<L.p.length;i++){
    var pd=L.p[i];
    var def=PIG_DEFS[pd[0]]||PIG_DEFS.n;
    var r=def.r*S;
    pigs.push(new Pig(base+pd[1]*S,G0-pd[2]*S-r,pd[0]));
  }

  spawnBird();
  updateHUD();
}

function spawnBird(){
  if(currentBird)return;
  if(birdQueue.length===0)return;
  currentBird=new Bird(slingX,slingY,birdQueue[0]);
  birds.push(currentBird);
  updateHUD();
}

function launchBird(vx,vy){
  if(!currentBird)return;
  var t=currentBird.type;
  currentBird.launched=true;
  currentBird.vx=vx;
  currentBird.vy=vy;
  currentBird.rotSpeed=(vx>0?1:-1)*6;
  birdQueue.shift();
  currentBird=null;
  updateHUD();
  sfxLaunch();
  if(ABILITY_HINT[t])showHint(ABILITY_HINT[t]);
}

function maybeSpawnNext(){
  if(currentBird)return;
  if(birdQueue.length===0)return;
  for(var i=0;i<birds.length;i++){
    var b=birds[i];
    if(b.launched&&!b.dead)return;
  }
  spawnBird();
}

/* ============ HUD / UI ============ */
function updateHUD(){
  scoreEl.textContent=score;
  levelEl.textContent=level;
  var html='';
  for(var i=0;i<birdQueue.length;i++){
    var d=BIRD_DEFS[birdQueue[i]]||BIRD_DEFS.red;
    html+='<div class="bird-icon" style="background:radial-gradient(circle at 35% 30%,'+d.light+','+d.color+')"></div>';
  }

}

var toastTimer=null,hintTimer=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1400);
}
function showHint(msg){

  hintEl.classList.add('show');
  if(hintTimer)clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){hintEl.classList.remove('show');},2200);
}
function hideHint(){
  hintEl.classList.remove('show');
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null;}
}

function showOverlay(el){

}
function hideOverlay(el){
  el.classList.add('hidden');
}
function hideAllOverlays(){
  hideOverlay(menuOverlay);
  hideOverlay(winOverlay);
  hideOverlay(loseOverlay);

}

function starHTML(n){
  var s='';
  for(var i=0;i<3;i++)s+=(i<n?'★':'<span class="off">★</span>');
  return s;
}

function saveBest(){
  if(score>best){
    best=score;
    try{localStorage.setItem('ab_best',String(best));}catch(e){}
  }
  bestLabel.textContent='🏆 Рекорд: '+best;
}

function buildLegend(){
  var keys=['red','yellow','blue','black','white'];
  var html='';
  for(var i=0;i<keys.length;i++){
    var d=BIRD_DEFS[keys[i]];
    html+='<div class="legend-item"><span class="legend-dot" style="background:radial-gradient(circle at 35% 30%,'+d.light+','+d.color+')"></span>'+d.label+'</div>';
  }

}

/* ============ END CONDITIONS ============ */
function checkEnd(dt){
  if(endTimer>0){
    endTimer-=dt;
    if(endTimer<=0){
      endTimer=0;
      if(endAction==='win')doWin();
      else if(endAction==='lose')doLose();
      endAction='';
    }
    return;
  }
  var alive=0,i;
  for(i=0;i<pigs.length;i++)if(!pigs[i].dead)alive++;
  if(pigs.length>0&&alive===0){
    endTimer=1.05;
    endAction='win';
    return;
  }
  if(birdQueue.length>0)return;
  if(currentBird)return;
  for(i=0;i<birds.length;i++){
    if(birds[i].launched&&!birds[i].dead)return;
  }
  if(alive>0){
    endTimer=1.3;
    endAction='lose';
  }
}

function doWin(){
  var left=birdQueue.length;
  var bonus=left*750;
  score+=1000+bonus;
  updateHUD();
  saveBest();
  var stars=left>=2?3:(left>=1?2:1);
  winScoreEl.textContent=score;
  winStarsEl.innerHTML=starHTML(stars);
  var L=LEVELS[(level-1)%LEVELS.length];
  winTitleEl.textContent=(level>=LEVELS.length)?'ФИНАЛ ПРОЙДЕН!':'УРОВЕНЬ ПРОЙДЕН!';
  state='win';
  showOverlay(winOverlay);
  hideHint();
  sfxWin();
}

function doLose(){
  state='lose';
  saveBest();
  showOverlay(loseOverlay);
  hideHint();
  sfxLose();
}

/* ============ UPDATE ============ */
function updateCamera(dt){
  var t=0;
  var bx=-Infinity;
  for(var i=0;i<birds.length;i++){
    var b=birds[i];
    if(!b.launched||b.dead)continue;
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp>200*SCALE)bx=Math.max(bx,b.x);
  }
  if(bx>-Infinity)t=bx-W*0.55;
  t=Math.max(0,Math.min(t,W*0.45));
  cameraTarget=t;
  cameraX+=(cameraTarget-cameraX)*Math.min(1,dt*5);
  if(Math.abs(cameraX-cameraTarget)<0.4)cameraX=cameraTarget;
}

function update(dt){
  if(shake>0){shake-=dt*70;if(shake<0)shake=0;}

  if(state!=='playing')return;

  acc+=dt;
  var iter=0;
  while(acc>=FIXED&&iter<12){
    physicsStep(FIXED);
    acc-=FIXED;
    iter++;
  }
  if(acc>FIXED*12)acc=0;

  updateParticles(dt);
  updatePopups(dt);
  updateCamera(dt);

  var alive=[];
  for(var i=0;i<birds.length;i++){
    if(!birds[i].dead)alive.push(birds[i]);
  }
  birds=alive;

  maybeSpawnNext();
  checkEnd(dt);
}

/* ============ RENDER ============ */
function drawCloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.arc(x+r*0.8,y-r*0.3,r*0.7,0,Math.PI*2);
  ctx.arc(x-r*0.8,y-r*0.2,r*0.6,0,Math.PI*2);
  ctx.arc(x+r*0.3,y-r*0.7,r*0.6,0,Math.PI*2);
  ctx.fill();
}

function drawSky(){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5fb8e0');
  sky.addColorStop(0.5,'#a8dcf0');
  sky.addColorStop(1,'#dff2df');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,235,140,.95)';
  ctx.beginPath();ctx.arc(W*0.84,H*0.12,48*SCALE,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,190,.3)';
  ctx.beginPath();ctx.arc(W*0.84,H*0.12,78*SCALE,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.85)';
  var cp=0.06*cameraX;
  drawCloud(W*0.15-cp,H*0.14,58*SCALE);
  drawCloud(W*0.52-cp*1.4,H*0.08,40*SCALE);
  drawCloud(W*0.80-cp*1.8,H*0.22,48*SCALE);
}

function drawWorldBg(){
  var g=groundY();
  ctx.fillStyle='#8fd08f';
  ctx.beginPath();
  ctx.moveTo(0,g);
  for(var x=-100;x<=W+100;x+=40){
    var h=Math.sin((x+cameraX*0.35)*0.005)*40*SCALE+62*SCALE;
    ctx.lineTo(x,g-h);
  }
  ctx.lineTo(W+100,g);
  ctx.lineTo(W+100,H);
  ctx.lineTo(-100,H);
  ctx.closePath();
  ctx.fill();

  var gg=ctx.createLinearGradient(0,g,0,H);
  gg.addColorStop(0,'#8b5a2b');
  gg.addColorStop(1,'#5c3a1a');
  ctx.fillStyle=gg;
  ctx.fillRect(-100,g,W+200,H-g+100);

  ctx.fillStyle='#4a9e4a';
  ctx.fillRect(-100,g-8,W+200,10);

  ctx.strokeStyle='#3d8a3d';
  ctx.lineWidth=2;
  for(var x2=-100;x2<W+100;x2+=16){
    ctx.beginPath();
    ctx.moveTo(x2,g-8);
    ctx.lineTo(x2+4,g-8-7*SCALE-4);
    ctx.stroke();
  }
}

function drawSling(){
  var sx=slingX-cameraX;
  var sy=slingY;
  var g=groundY();
  if(sx<-200||sx>W+200)return;

  ctx.strokeStyle='#6b3a1a';
  ctx.lineWidth=Math.max(3,8*SCALE);
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx-5*SCALE,g);ctx.lineTo(sx-5*SCALE,sy+30*SCALE);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+5*SCALE,g);ctx.lineTo(sx+5*SCALE,sy+30*SCALE);ctx.stroke();

  ctx.strokeStyle='#8b5a2b';
  ctx.lineWidth=Math.max(4,10*SCALE);
  ctx.beginPath();ctx.moveTo(sx-5*SCALE,sy+30*SCALE);ctx.lineTo(sx-15*SCALE,sy-10*SCALE);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+5*SCALE,sy+30*SCALE);ctx.lineTo(sx+15*SCALE,sy-10*SCALE);ctx.stroke();

  ctx.strokeStyle='#3d2b1a';
  if(currentBird&&!currentBird.launched){
    ctx.lineWidth=Math.max(2,5*SCALE);
    ctx.beginPath();
    ctx.moveTo(sx-15*SCALE,sy-10*SCALE);
    ctx.lineTo(currentBird.x-cameraX,currentBird.y);
    ctx.lineTo(sx+15*SCALE,sy-10*SCALE);
    ctx.stroke();
  }else{
    ctx.lineWidth=Math.max(2,4*SCALE);
    ctx.beginPath();
    ctx.moveTo(sx-15*SCALE,sy-10*SCALE);
    ctx.lineTo(sx+15*SCALE,sy-10*SCALE);
    ctx.stroke();
  }
}

function drawTrajectory(){
  if(!dragging||!currentBird||currentBird.launched)return;
  var dx=slingX-currentBird.x;
  var dy=slingY-currentBird.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<12*SCALE)return;
  var maxPull=180*SCALE;
  var power=Math.min(dist,maxPull);
  var angle=Math.atan2(dy,dx);
  var speed=power*10;
  var vx=Math.cos(angle)*speed;
  var vy=Math.sin(angle)*speed;
  var x0=currentBird.x,y0=currentBird.y;
  var gy=groundY();

  var pct=power/maxPull;
  var rC=Math.round(80+175*pct);
  var gC=Math.round(220-160*pct);
  ctx.fillStyle='rgba('+rC+','+gC+',80,.85)';

  for(var i=1;i<=36;i++){
    var t=i*0.055;
    var px=x0+vx*t;
    var py=y0+vy*t+0.5*G*t*t;
    if(py>gy)break;
    var rad=Math.max(1.2,4*SCALE-i*0.075*SCALE);
    ctx.beginPath();
    ctx.arc(px-cameraX,py,rad,0,Math.PI*2);
    ctx.fill();
  }

  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(slingX-cameraX,slingY);
  ctx.lineTo(currentBird.x-cameraX,currentBird.y);
  ctx.stroke();
}

function render(){
  drawSky();
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }
  drawWorldBg();
  drawSling();
  var i;
  for(i=0;i<blocks.length;i++)blocks[i].draw();
  for(i=0;i<pigs.length;i++)pigs[i].draw();
  drawBombs();
  drawTrajectory();
  for(i=0;i<birds.length;i++)birds[i].draw();
  drawParticles();
  drawPopups();
  ctx.restore();
}

/* ============ LOOP ============ */
function loop(ts){
  if(!lastTime)lastTime=ts;
  var dt=(ts-lastTime)/1000;
  lastTime=ts;
  if(dt>0.06)dt=0.06;
  if(dt<0)dt=0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============ INPUT ============ */
function getPos(e){
  var r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function onDown(e){
  initAudio();
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(er){}}
  if(state!=='playing')return;

  for(var i=birds.length-1;i>=0;i--){
    var b=birds[i];
    if(b.launched&&!b.dead&&!b.abilityUsed&&b.def.ability){
      if(b.activate()){
        if(e.cancelable)e.preventDefault();
        hideHint();
        return;
      }
    }
  }

  if(!currentBird||currentBird.launched)return;
  var p=getPos(e);
  var dx=p.x-(currentBird.x-cameraX);
  var dy=p.y-currentBird.y;
  var hitR=Math.max(95*SCALE,64);
  if(dx*dx+dy*dy<hitR*hitR){
    dragging=true;
    if(e.cancelable)e.preventDefault();
  }
}

function onMove(e){
  if(!dragging||!currentBird||currentBird.launched)return;
  if(e.cancelable)e.preventDefault();
  var p=getPos(e);
  var tx=p.x-cameraX;
  var ty=p.y;
  var dx=tx-slingX;
  var dy=ty-slingY;
  var dist=Math.sqrt(dx*dx+dy*dy);
  var maxPull=180*SCALE;
  if(dist>maxPull){
    tx=slingX+dx/dist*maxPull;
    ty=slingY+dy/dist*maxPull;
  }
  if(ty>slingY+40*SCALE)ty=slingY+40*SCALE;
  currentBird.x=tx;
  currentBird.y=ty;
}

function onUp(e){
  if(!dragging)return;
  dragging=false;
  if(!currentBird||currentBird.launched)return;
  var dx=slingX-currentBird.x;
  var dy=slingY-currentBird.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<14*SCALE){
    currentBird.x=slingX;
    currentBird.y=slingY;
    return;
  }
  var maxPull=180*SCALE;
  var power=Math.min(dist,maxPull);
  var angle=Math.atan2(dy,dx);
  var speed=power*10;
  launchBird(Math.cos(angle)*speed,Math.sin(angle)*speed);
}

canvas.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onUp,{passive:false});
canvas.addEventListener('touchstart',function(e){if(e.cancelable)e.preventDefault();},{passive:false});

if(!window.PointerEvent){
  canvas.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp,{passive:false});
}

/* ============ GAME FLOW ============ */
function startGame(){
  initAudio();
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  clearEndTimer();
  score=0;
  level=1;
  state='playing';
  hideAllOverlays();
  toastEl.classList.remove('show');
  setupLevel();
}

function restartLevel(){
  clearEndTimer();
  state='playing';
  hideAllOverlays();
  toastEl.classList.remove('show');
  setupLevel();
}

function nextLevel(){
  clearEndTimer();
  level++;
  if(level>LEVELS.length){
    level=1;
    toast('🏆 ВСЕ УРОВНИ ПРОЙДЕНЫ!');
  }
  state='playing';
  hideAllOverlays();
  setupLevel();
}

function goMenu(){
  clearEndTimer();
  state='menu';
  score=0;
  level=1;
  saveBest();
  hideAllOverlays();
  showOverlay(menuOverlay);
  setupLevel();
}

function togglePause(){
  if(state==='playing'){
    state='paused';
    showOverlay(pauseOverlay);
  }else if(state==='paused'){
    state='playing';
    hideOverlay(pauseOverlay);
  }
}

nextBtn.addEventListener('click',function(e){e.preventDefault();nextLevel();});
retryBtn.addEventListener('click',function(e){e.preventDefault();restartLevel();});
resumeBtn.addEventListener('click',function(e){e.preventDefault();togglePause();});
pauseRestartBtn.addEventListener('click',function(e){e.preventDefault();restartLevel();});
menuBtn.addEventListener('click',function(e){e.preventDefault();goMenu();});
pauseBtn.addEventListener('click',function(e){e.preventDefault();togglePause();});
restartBtn.addEventListener('click',function(e){e.preventDefault();if(state==='playing'||state==='paused')restartLevel();});
soundBtn.addEventListener('click',function(e){

  soundOn=!soundOn;
  soundBtn.textContent=soundOn?'🔊':'🔇';
  if(soundOn){initAudio();if(AC&&AC.state==='suspended'){try{AC.resume();}catch(er){}}tone(660,0.09,'sine',0.1);}
});

window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){
    if(state==='menu'){e.preventDefault();startGame();}
    else if(state==='win'){e.preventDefault();nextLevel();}
    else if(state==='lose'){e.preventDefault();restartLevel();}
    else if(state==='paused'){e.preventDefault();togglePause();}
  }
  if(e.code==='Escape'||e.code==='KeyP'){
    if(state==='playing'||state==='paused'){e.preventDefault();togglePause();}
  }
  if(e.code==='KeyR'){
    if(state==='playing'){e.preventDefault();restartLevel();}
  }
  if(e.code==='Space'&&state==='playing'){
    e.preventDefault();
    for(var i=birds.length-1;i>=0;i--){
      var b=birds[i];
      if(b.launched&&!b.dead&&!b.abilityUsed&&b.def.ability){
        if(b.activate()){hideHint();break;}
      }
    }
  }
});

var resizeTimer=null;
window.addEventListener('resize',function(){
  resize();
  if(resizeTimer)clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    resizeTimer=null;
    if(state==='playing'||state==='paused')setupLevel();
  },280);
});
window.addEventListener('orientationchange',function(){
  setTimeout(function(){
    resize();
    if(state==='playing'||state==='paused')setupLevel();
  },320);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='playing')togglePause();
});

/* ============ BOOT ============ */
resize();
buildLegend();
setupLevel();
updateHUD();
saveBest();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
