<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angry Birds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#87ceeb;touch-action:none;position:fixed;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:10;color:#fff;font-weight:700;font-size:clamp(11px,2.4vw,15px);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hud div,#hud button{background:rgba(0,0,0,.35);padding:5px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.15);color:#fff;font:inherit}
#hud span{color:#ffd54a}
#hud button{pointer-events:auto;cursor:pointer;padding:5px 11px;font-size:15px}
#hud button:active{transform:scale(.9)}
.o{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:20;padding:20px;text-align:center;gap:14px}
.o.h{display:none}
h1{font-size:clamp(22px,5.5vw,48px);background:linear-gradient(135deg,#ffd54a,#ff6b6b,#c92a2a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:2px;line-height:1.15}
.o p{color:#cbd5e1;font-size:clamp(12px,2.6vw,16px);max-width:500px;line-height:1.5}
.b{padding:12px 36px;font-size:clamp(14px,2.6vw,17px);font-weight:800;border:0;border-radius:50px;background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff;cursor:pointer;letter-spacing:1px;font-family:inherit;box-shadow:0 8px 24px rgba(201,42,42,.4)}
.b:active{transform:scale(.96)}
.s{color:#e2e8f0;font-size:clamp(14px,2.8vw,18px);font-weight:700}
.s b{color:#ffd54a}
.st{font-size:clamp(34px,8vw,54px);color:#ffd54a;letter-spacing:8px;text-shadow:0 0 20px rgba(255,213,74,.6);line-height:1}
.st .o{color:#3a3a3a;text-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div>Очки: <span id="sc">0</span></div>
<div>Ур. <span id="lv">1</span></div>
<button id="rb">🔄</button>
</div>
<div id="menu" class="o">
<h1>🐦 ANGRY BIRDS</h1>
<p>Перетащи птицу назад и отпусти — запусти её в свинок!</p>
<button class="b" id="pl">ИГРАТЬ</button>
</div>
<div id="win" class="o h">
<h1 id="wt">УРОВЕНЬ ПРОЙДЕН!</h1>
<div class="st" id="ws"></div>
<div class="s">Очки: <b id="wsc">0</b></div>
<button class="b" id="nx">ДАЛЕЕ ▶</button>
</div>
<div id="lose" class="o h">
<h1>💥 ПРОВАЛ</h1>
<p>Свинки выжили! Попробуй ещё раз.</p>
<button class="b" id="rt">ПОВТОРИТЬ</button>
</div>
<script>
(function(){
'use strict';
var C=document.getElementById('c'),X=C.getContext('2d');
var scE=document.getElementById('sc'),lvE=document.getElementById('lv');
var menu=document.getElementById('menu'),winO=document.getElementById('win'),loseO=document.getElementById('lose');
var wtE=document.getElementById('wt'),wsE=document.getElementById('ws'),wscE=document.getElementById('wsc');
var W,H,DPR,G=1600,gy,S=1,state='menu',score=0,level=1;
var blocks=[],pigs=[],birds=[],queue=[],cur=null,drag=false;
var slingX=0,slingY=0,acc=0,last=0,endT=0,endA='';
var parts=[];

var LV=[
 {b:3,v:[[0,0,20,80],[72,0,20,80],[36,80,130,20]],p:[[36,0],[36,100]]},
 {b:3,v:[[0,0,20,90],[72,0,20,90],[144,0,20,90],[72,90,220,20],[36,110,18,60,'i'],[108,110,18,60,'i'],[72,170,180,20]],p:[[36,0],[108,0],[72,190]]},
 {b:4,v:[[0,0,20,100,'s'],[80,0,20,100,'s'],[160,0,20,100,'s'],[80,100,240,20],[40,120,18,60,'i'],[120,120,18,60,'i'],[80,180,220,20],[40,200,20,60],[120,200,20,60],[80,260,180,20]],p:[[40,0],[120,0],[80,200],[80,280]]}
];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  C.width=Math.floor(W*DPR);C.height=Math.floor(H*DPR);
  C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
  S=Math.max(.4,Math.min(W/900,H/600,1.5));
  G=1600*S;
  gy=H-Math.max(50,H*.08);
  slingX=Math.min(W*.18,260);
  slingY=gy-Math.max(90,Math.min(H*.22,160));
}

function Bird(x,y){this.x=x;this.y=y;this.vx=0;this.vy=0;this.r=18*S;this.launched=false;this.dead=false;this.age=0;this.rest=0;}
function Pig(x,y){this.x=x;this.y=y;this.r=22*S;this.vx=0;this.vy=0;this.hp=16;this.dead=false;this.hurt=0;this.settled=true;}
Pig.prototype.hit=function(d){
  if(this.dead||d<=0)return;
  this.hp-=d;this.hurt=.3;this.settled=false;
  if(this.hp<=0){this.dead=true;score+=300;spawnParts(this.x,this.y,'#a5d8a5',10);updateHUD();}
};
function Block(cx,by,w,h,t){
  this.x=cx;this.y=by-h/2;this.w=w;this.h=h;this.t=t||'w';
  this.vx=0;this.vy=0;this.hp=this.mhp=(t==='i'?10:t==='s'?40:20);
  this.dead=false;this.settled=true;
}
Block.prototype.hit=function(d){
  if(this.dead||d<=0)return;
  this.hp-=d;
  if(this.hp<=0){this.dead=true;score+=this.t==='i'?40:this.t==='s'?100:50;spawnParts(this.x,this.y,this.t==='i'?'#b4dcff':this.t==='s'?'#cfd6dd':'#c98a4b',8);updateHUD();}
};

function dmg(sp){return Math.max(.4,sp/(100*S));}
function spawnParts(x,y,c,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,sv=(Math.random()*.7+.3)*300*S;
    parts.push({x:x,y:y,vx:Math.cos(a)*sv,vy:Math.sin(a)*sv-70*S,l:.5,c:c,sz:(Math.random()*3+2)*S});
  }
  if(parts.length>180)parts.splice(0,parts.length-180);
}
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.vy+=G*.55*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;
    if(p.l<=0)parts.splice(i,1);
  }
}
function baseX(){return Math.min(W*.62,W-160*S);}
function circleRect(cx,cy,cr,r){
  var dx=cx-r.x,dy=cy-r.y;
  var px=Math.max(-r.w/2,Math.min(r.w/2,dx));
  var py=Math.max(-r.h/2,Math.min(r.h/2,dy));
  var ex=dx-px,ey=dy-py;
  return ex*ex+ey*ey<cr*cr;
}

function setupLevel(){
  blocks=[];pigs=[];birds=[];queue=[];parts=[];
  cur=null;drag=false;acc=0;endT=0;endA='';
  var L=LV[(level-1)%LV.length],bx=baseX(),i;
  for(i=0;i<L.b;i++)queue.push('r');
  for(i=0;i<L.v.length;i++){
    var v=L.v[i];
    blocks.push(new Block(bx+v[0]*S,gy-v[1]*S,v[2]*S,v[3]*S,v[4]));
  }
  for(i=0;i<L.p.length;i++){
    var p=L.p[i];
    pigs.push(new Pig(bx+p[0]*S,gy-p[1]*S-22*S));
  }
  spawnBird();updateHUD();
}
function spawnBird(){
  if(cur||!queue.length)return;
  cur=new Bird(slingX,slingY);
  birds.push(cur);
}
function updateHUD(){scE.textContent=score;lvE.textContent=level;}

function step(dt){
  var i,j;
  for(i=0;i<birds.length;i++){
    var b=birds[i];
    if(b.dead)continue;
    b.age+=dt;
    if(!b.launched)continue;
    b.vy+=G*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    var g=gy-b.r;
    if(b.y>g){
      if(b.vy>400*S)spawnParts(b.x,g,'#c9a06a',4);
      b.y=g;b.vy*=-.35;b.vx*=.72;
    }
    if(Math.abs(b.vx)<30*S&&Math.abs(b.vy)<30*S)b.rest+=dt;else b.rest=0;
    if(b.rest>.4)b.dead=true;
    if(b.age>12||b.x>W+900||b.x<-900||b.y>H+900)b.dead=true;
  }
  for(i=0;i<pigs.length;i++){
    var p=pigs[i];
    if(p.dead)continue;
    if(p.hurt>0)p.hurt-=dt;
    if(p.settled)continue;
    p.vy+=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    var pg=gy-p.r;
    if(p.y>pg){
      var imp=Math.abs(p.vy);
      p.y=pg;p.vy=0;p.vx*=.7;
      if(imp>500*S)p.hit(dmg(imp)*.7);
      if(Math.abs(p.vx)<20*S){p.vx=0;p.settled=true;}
    }
    if(p.x<-400||p.x>W+900||p.y>H+900)p.dead=true;
  }
  for(i=0;i<blocks.length;i++){
    var bk=blocks[i];
    if(bk.dead||bk.settled)continue;
    bk.vy+=G*dt;bk.x+=bk.vx*dt;bk.y+=bk.vy*dt;
    var bg=gy-bk.h/2;
    if(bk.y>bg){
      var imp2=Math.abs(bk.vy);
      bk.y=bg;bk.vy=0;bk.vx*=.5;
      if(imp2>480*S)bk.hit(dmg(imp2)*1.6);
      if(Math.abs(bk.vx)<25*S){bk.vx=0;bk.settled=true;}
    }
    if(bk.x<-500||bk.x>W+1000||bk.y>H+900)bk.dead=true;
  }
  for(i=0;i<blocks.length;i++){
    var a=blocks[i];
    if(a.dead||a.settled)continue;
    for(j=0;j<blocks.length;j++){
      var b2=blocks[j];
      if(a===b2||b2.dead)continue;
      var hw=(a.w+b2.w)/2,hh=(a.h+b2.h)/2;
      var dx=a.x-b2.x,dy=a.y-b2.y;
      if(Math.abs(dx)<hw&&Math.abs(dy)<hh){
        var px=hw-Math.abs(dx),py=hh-Math.abs(dy);
        if(py<=px){
          a.y=dy<0?b2.y-hh:b2.y+hh;
          if(dy<0&&a.vy>0)a.vy=0;
          if(dy>0&&a.vy<0)a.vy=0;
          a.vx*=.5;
          if(Math.abs(a.vx)<25*S&&Math.abs(a.vy)<25*S){a.vx=0;a.vy=0;a.settled=true;}
          if(Math.abs(a.vy)>380*S)a.hit(dmg(Math.abs(a.vy))*.9);
        }else{
          a.x=dx<0?b2.x-hw:b2.x+hw;
          a.vx*=-.3;
        }
      }
    }
  }
  var tol=10*S;
  for(i=0;i<blocks.length;i++){
    var bl=blocks[i];
    if(bl.dead||!bl.settled)continue;
    var bot=bl.y+bl.h/2;
    if(bot>=gy-2)continue;
    var ok=false;
    for(j=0;j<blocks.length;j++){
      var o=blocks[j];
      if(o===bl||o.dead)continue;
      if(Math.abs(bot-(o.y-o.h/2))<tol&&Math.abs(bl.x-o.x)<(bl.w+o.w)/2){ok=true;break;}
    }
    if(!ok)bl.settled=false;
  }
  for(i=0;i<pigs.length;i++){
    var pg2=pigs[i];
    if(pg2.dead||!pg2.settled)continue;
    var pb=pg2.y+pg2.r;
    if(pb>=gy-2)continue;
    var okp=false;
    for(j=0;j<blocks.length;j++){
      var o2=blocks[j];
      if(o2.dead)continue;
      if(Math.abs(pb-(o2.y-o2.h/2))<tol&&Math.abs(pg2.x-o2.x)<(pg2.r+o2.w/2)){okp=true;break;}
    }
    if(!okp)pg2.settled=false;
  }
  for(i=0;i<birds.length;i++){
    var bd=birds[i];
    if(!bd.launched||bd.dead)continue;
    var sp=Math.sqrt(bd.vx*bd.vx+bd.vy*bd.vy);
    for(j=0;j<pigs.length;j++){
      var pi=pigs[j];
      if(pi.dead)continue;
      var ddx=bd.x-pi.x,ddy=bd.y-pi.y;
      var d2=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      if(d2<bd.r+pi.r){
        if(sp>150*S)pi.hit(dmg(sp)*1.15);
        pi.vx=ddx/d2*sp*.5;
        pi.vy=ddy/d2*sp*.3-140*S;
        pi.settled=false;
        bd.vx*=.5;bd.vy*=.5;
        bd.x=pi.x+ddx/d2*(bd.r+pi.r);
        bd.y=pi.y+ddy/d2*(bd.r+pi.r);
      }
    }
    for(j=0;j<blocks.length;j++){
      var bo=blocks[j];
      if(bo.dead)continue;
      if(circleRect(bd.x,bd.y,bd.r,bo)){
        if(sp>200*S){
          bo.hit(Math.min(48,dmg(sp)));
          var bx2=bd.x-bo.x,by2=bd.y-bo.y;
          var bl2=Math.sqrt(bx2*bx2+by2*by2)||1;
          bo.vx=bx2/bl2*sp*.42;
          bo.vy=by2/bl2*sp*.42;
          bo.settled=false;
        }
        bd.vx*=.66;bd.vy*=.66;
      }
    }
  }
  for(i=0;i<blocks.length;i++){
    var blk=blocks[i];
    if(blk.dead||blk.settled)continue;
    var sp3=Math.sqrt(blk.vx*blk.vx+blk.vy*blk.vy);
    if(sp3<120*S)continue;
    for(j=0;j<pigs.length;j++){
      var pg3=pigs[j];
      if(pg3.dead)continue;
      if(Math.abs(blk.x-pg3.x)<blk.w/2+pg3.r&&Math.abs(blk.y-pg3.y)<blk.h/2+pg3.r){
        pg3.hit(dmg(sp3)*.95);
        pg3.vx=blk.vx*.5;
        pg3.vy=blk.vy*.3-120*S;
        pg3.settled=false;
      }
    }
  }
}

function maybeSpawnNext(){
  if(cur||!queue.length)return;
  for(var i=0;i<birds.length;i++)if(birds[i].launched&&!birds[i].dead)return;
  spawnBird();
}
function checkEnd(dt){
  if(endT>0){
    endT-=dt;
    if(endT<=0){endT=0;if(endA==='w')doWin();else if(endA==='l')doLose();endA='';}
    return;
  }
  var alive=0,i;
  for(i=0;i<pigs.length;i++)if(!pigs[i].dead)alive++;
  if(pigs.length>0&&alive===0){endT=1;endA='w';return;}
  if(queue.length>0||cur)return;
  for(i=0;i<birds.length;i++)if(birds[i].launched&&!birds[i].dead)return;
  if(alive>0){endT=1.2;endA='l';}
}
function doWin(){
  var left=queue.length;
  score+=1000+left*750;
  updateHUD();
  var stars=left>=2?3:left>=1?2:1;
  wscE.textContent=score;
  var h='';
  for(var i=0;i<3;i++)h+=i<stars?'★':'<span class="o">★</span>';
  wsE.innerHTML=h;
  wtE.textContent=level>=LV.length?'ФИНАЛ ПРОЙДЕН!':'УРОВЕНЬ ПРОЙДЕН!';
  state='win';winO.classList.remove('h');
}
function doLose(){state='lose';loseO.classList.remove('h');}

function cloud(x,y,r){
  X.beginPath();
  X.arc(x,y,r,0,6.283);
  X.arc(x+r*.8,y-r*.3,r*.7,0,6.283);
  X.arc(x-r*.8,y-r*.2,r*.6,0,6.283);
  X.arc(x+r*.3,y-r*.7,r*.6,0,6.283);
  X.fill();
}
function drawBird(b){
  if(b.dead)return;
  var r=b.r;
  X.save();
  X.translate(b.x,b.y);
  var gr=X.createRadialGradient(-r*.3,-r*.35,2,0,0,r*1.15);
  gr.addColorStop(0,'#ff9aa2');gr.addColorStop(1,'#e63946');
  X.fillStyle=gr;
  X.beginPath();X.arc(0,0,r,0,6.283);X.fill();
  X.strokeStyle='#8d1f28';X.lineWidth=Math.max(1,2*S);X.stroke();
  X.fillStyle='#ffe8b0';
  X.beginPath();X.ellipse(0,r*.38,r*.5,r*.34,0,0,6.283);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(r*.25,-r*.35,r*.33,0,6.283);X.fill();
  X.beginPath();X.arc(-r*.15,-r*.35,r*.29,0,6.283);X.fill();
  X.fillStyle='#111';
  X.beginPath();X.arc(r*.32,-r*.35,r*.13,0,6.283);X.fill();
  X.beginPath();X.arc(-r*.08,-r*.35,r*.12,0,6.283);X.fill();
  X.strokeStyle='#111';X.lineWidth=Math.max(2,3*S);X.lineCap='round';
  X.beginPath();X.moveTo(r*.05,-r*.72);X.lineTo(r*.52,-r*.52);X.stroke();
  X.beginPath();X.moveTo(-r*.42,-r*.68);X.lineTo(-r*.04,-r*.56);X.stroke();
  X.fillStyle='#ffa94d';
  X.beginPath();
  X.moveTo(r*.52,r*.02);X.lineTo(r*1.05,r*.14);X.lineTo(r*.52,r*.32);
  X.closePath();X.fill();
  X.strokeStyle='#e8590c';X.lineWidth=Math.max(1,1.4*S);X.stroke();
  X.restore();
}
function drawPig(p){
  if(p.dead)return;
  var r=p.r;
  X.save();
  X.translate(p.x,p.y);
  var gr=X.createRadialGradient(-r*.3,-r*.3,2,0,0,r*1.1);
  if(p.hurt>0){gr.addColorStop(0,'#ffd0d0');gr.addColorStop(1,'#ff6b6b');}
  else{gr.addColorStop(0,'#b4e6b4');gr.addColorStop(1,'#3f8f3f');}
  X.fillStyle=gr;
  X.beginPath();X.arc(0,0,r,0,6.283);X.fill();
  X.strokeStyle='#2d6a2d';X.lineWidth=Math.max(1,2*S);X.stroke();
  X.fillStyle=p.hurt>0?'#ff9b9b':'#4a9e4a';
  X.beginPath();X.arc(-r*.6,-r*.78,r*.3,0,6.283);X.fill();
  X.beginPath();X.arc(r*.6,-r*.78,r*.3,0,6.283);X.fill();
  X.fillStyle=p.hurt>0?'#ffc9c9':'#7bc47b';
  X.beginPath();X.ellipse(0,r*.16,r*.56,r*.43,0,0,6.283);X.fill();
  X.strokeStyle='#2d6a2d';X.lineWidth=Math.max(1,1.4*S);X.stroke();
  X.fillStyle='#2d6a2d';
  X.beginPath();X.ellipse(-r*.19,r*.16,r*.08,r*.12,0,0,6.283);X.fill();
  X.beginPath();X.ellipse(r*.19,r*.16,r*.08,r*.12,0,0,6.283);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(-r*.35,-r*.22,r*.23,0,6.283);X.fill();
  X.beginPath();X.arc(r*.35,-r*.22,r*.23,0,6.283);X.fill();
  X.fillStyle='#111';
  X.beginPath();X.arc(-r*.3,-r*.22,r*.1,0,6.283);X.fill();
  X.beginPath();X.arc(r*.4,-r*.22,r*.1,0,6.283);X.fill();
  X.restore();
}
function drawBlock(b){
  if(b.dead)return;
  X.save();
  X.translate(b.x,b.y);
  var w=b.w,h=b.h,fill,stroke;
  if(b.t==='w'){fill='#c98a4b';stroke='#8b5a2b';}
  else if(b.t==='s'){fill='#9aa5b1';stroke='#5c6672';}
  else{fill='rgba(180,220,255,.9)';stroke='#7ab8e8';}
  X.fillStyle=fill;X.fillRect(-w/2,-h/2,w,h);
  X.strokeStyle=stroke;X.lineWidth=Math.max(1,2*S);X.strokeRect(-w/2,-h/2,w,h);
  if(b.t==='w'){
    X.strokeStyle='rgba(139,90,43,.45)';X.lineWidth=1;
    for(var i=1;i<3;i++){
      X.beginPath();X.moveTo(-w/2,-h/2+i*h/3);X.lineTo(w/2,-h/2+i*h/3);X.stroke();
    }
  }
  if(b.t==='i'){
    X.fillStyle='rgba(255,255,255,.55)';
    X.fillRect(-w/2+2,-h/2+2,Math.max(1,w*.22),Math.max(2,h*.55));
  }
  X.restore();
}
function drawSling(){
  var sx=slingX,sy=slingY;
  X.strokeStyle='#6b3a1a';X.lineWidth=Math.max(3,8*S);X.lineCap='round';
  X.beginPath();X.moveTo(sx-5*S,gy);X.lineTo(sx-5*S,sy+30*S);X.stroke();
  X.beginPath();X.moveTo(sx+5*S,gy);X.lineTo(sx+5*S,sy+30*S);X.stroke();
  X.strokeStyle='#8b5a2b';X.lineWidth=Math.max(4,10*S);
  X.beginPath();X.moveTo(sx-5*S,sy+30*S);X.lineTo(sx-15*S,sy-10*S);X.stroke();
  X.beginPath();X.moveTo(sx+5*S,sy+30*S);X.lineTo(sx+15*S,sy-10*S);X.stroke();
  X.strokeStyle='#3d2b1a';X.lineWidth=Math.max(2,5*S);
  if(cur&&!cur.launched){
    X.beginPath();
    X.moveTo(sx-15*S,sy-10*S);
    X.lineTo(cur.x,cur.y);
    X.lineTo(sx+15*S,sy-10*S);
    X.stroke();
  }else{
    X.beginPath();
    X.moveTo(sx-15*S,sy-10*S);X.lineTo(sx+15*S,sy-10*S);X.stroke();
  }
}
function drawTraj(){
  if(!drag||!cur||cur.launched)return;
  var dx=slingX-cur.x,dy=slingY-cur.y;
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d<12*S)return;
  var m=180*S,pw=Math.min(d,m),a=Math.atan2(dy,dx),sp=pw*10;
  var vx=Math.cos(a)*sp,vy=Math.sin(a)*sp;
  var x0=cur.x,y0=cur.y;
  var pct=pw/m;
  var rC=Math.round(80+175*pct),gC=Math.round(220-160*pct);
  X.fillStyle='rgba('+rC+','+gC+',80,.85)';
  for(var i=1;i<=30;i++){
    var t=i*.055,px=x0+vx*t,py=y0+vy*t+.5*G*t*t;
    if(py>gy)break;
    X.beginPath();
    X.arc(px,py,Math.max(1.2,4*S-i*.08*S),0,6.283);
    X.fill();
  }
}
function draw(){
  var sky=X.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5fb8e0');
  sky.addColorStop(.5,'#a8dcf0');
  sky.addColorStop(1,'#dff2df');
  X.fillStyle=sky;X.fillRect(0,0,W,H);
  X.fillStyle='rgba(255,235,140,.95)';
  X.beginPath();X.arc(W*.84,H*.12,48*S,0,6.283);X.fill();
  X.fillStyle='rgba(255,255,255,.85)';
  cloud(W*.15,H*.14,58*S);
  cloud(W*.52,H*.08,40*S);
  cloud(W*.8,H*.22,48*S);
  X.fillStyle='#8fd08f';
  X.beginPath();X.moveTo(0,gy);
  for(var x=-100;x<=W+100;x+=40){
    X.lineTo(x,gy-(Math.sin(x*.005)*40*S+62*S));
  }
  X.lineTo(W+100,gy);X.lineTo(W+100,H);X.lineTo(-100,H);X.closePath();X.fill();
  var gg=X.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#8b5a2b');gg.addColorStop(1,'#5c3a1a');
  X.fillStyle=gg;X.fillRect(-100,gy,W+200,H-gy+100);
  X.fillStyle='#4a9e4a';X.fillRect(-100,gy-8,W+200,10);
  drawSling();
  for(var i=0;i<blocks.length;i++)drawBlock(blocks[i]);
  for(i=0;i<pigs.length;i++)drawPig(pigs[i]);
  drawTraj();
  for(i=0;i<birds.length;i++)drawBird(birds[i]);
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    X.globalAlpha=Math.max(0,p.l/.5);
    X.fillStyle=p.c;
    X.beginPath();X.arc(p.x,p.y,p.sz,0,6.283);X.fill();
  }
  X.globalAlpha=1;
}

function getXY(e){
  var r=C.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function onDown(e){
  if(state!=='playing')return;
  if(!cur||cur.launched)return;
  var p=getXY(e);
  var dx=p.x-cur.x,dy=p.y-cur.y,hr=Math.max(95*S,64);
  if(dx*dx+dy*dy<hr*hr){drag=true;if(e.cancelable)e.preventDefault();}
}
function onMove(e){
  if(!drag||!cur||cur.launched)return;
  if(e.cancelable)e.preventDefault();
  var p=getXY(e);
  var dx=p.x-slingX,dy=p.y-slingY,d=Math.sqrt(dx*dx+dy*dy),m=180*S;
  if(d>m){dx=dx/d*m;dy=dy/d*m;}
  if(dy>40*S)dy=40*S;
  cur.x=slingX+dx;cur.y=slingY+dy;
}
function onUp(){
  if(!drag)return;
  drag=false;
  if(!cur||cur.launched)return;
  var dx=slingX-cur.x,dy=slingY-cur.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<14*S){cur.x=slingX;cur.y=slingY;return;}
  var m=180*S,pw=Math.min(d,m),a=Math.atan2(dy,dx),sp=pw*10;
  cur.launched=true;
  cur.vx=Math.cos(a)*sp;cur.vy=Math.sin(a)*sp;
  if(queue.length)queue.shift();
  cur=null;updateHUD();
}
C.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp,{passive:false});
window.addEventListener('pointercancel',onUp,{passive:false});
C.addEventListener('touchstart',function(e){if(e.cancelable)e.preventDefault();},{passive:false});

function start(){score=0;level=1;state='playing';menu.classList.add('h');setupLevel();}
document.getElementById('pl').onclick=start;
document.getElementById('nx').onclick=function(){
  level++;if(level>LV.length)level=1;
  state='playing';winO.classList.add('h');setupLevel();
};
document.getElementById('rt').onclick=function(){
  state='playing';loseO.classList.add('h');setupLevel();
};
document.getElementById('rb').onclick=function(){
  if(state==='playing')setupLevel();
};
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){
    if(state==='menu'){e.preventDefault();start();}
    else if(state==='win'){e.preventDefault();document.getElementById('nx').click();}
    else if(state==='lose'){e.preventDefault();document.getElementById('rt').click();}
  }
});
var rt=null;
window.addEventListener('resize',function(){
  resize();
  if(rt)clearTimeout(rt);
  rt=setTimeout(function(){
    rt=null;
    if(state==='playing')setupLevel();
  },280);
});

function loop(ts){
  if(!last)last=ts;
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.06)dt=0.06;
  if(dt<0)dt=0;
  if(state==='playing'){
    acc+=dt;
    var it=0;
    while(acc>=1/120&&it<8){step(1/120);acc-=1/120;it++;}
    if(acc>1/120*8)acc=0;
    maybeSpawnNext();
    checkEnd(dt);
  }
  updateParts(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
setupLevel();
requestAnimationFrame(loop);
})();
</script>
