<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Змейка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Segoe UI',sans-serif;overflow:hidden}
.game{text-align:center;padding:20px}
h1{color:#e94560;font-size:2.5rem;margin-bottom:15px;text-shadow:0 0 20px rgba(233,69,96,.5);letter-spacing:3px}
canvas{border:3px solid #e94560;border-radius:12px;box-shadow:0 0 30px rgba(233,69,96,.4),inset 0 0 30px rgba(0,0,0,.5);background:#0a0a1a;display:block;margin:0 auto}
.info{display:flex;justify-content:space-between;margin:15px auto 0;max-width:400px;color:#fff;font-size:1.1rem}
.score,.best{background:rgba(233,69,96,.15);padding:8px 20px;border-radius:20px;border:1px solid rgba(233,69,96,.3)}
.score span,.best span{color:#e94560;font-weight:bold}
.overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,26,.95);padding:30px 50px;border-radius:15px;border:2px solid #e94560;text-align:center;display:none}
.overlay.show{display:block}
.overlay h2{color:#e94560;margin-bottom:15px;font-size:1.8rem}
.overlay p{color:#aaa;margin-bottom:20px}
.btn{background:#e94560;color:#fff;border:none;padding:12px 35px;border-radius:25px;font-size:1.1rem;cursor:pointer;transition:.3s;font-weight:bold;letter-spacing:1px}
.btn:hover{background:#ff6b81;transform:scale(1.05);box-shadow:0 0 20px rgba(233,69,96,.6)}
.controls{color:#666;margin-top:15px;font-size:.9rem}
</style>
</head>
<body>
<div class="game">
<h1>ЗМЕЙКА</h1>
<canvas id="c" width="400" height="400"></canvas>
<div class="info">
<div class="score">Счёт: <span id="s">0</span></div>
<div class="best">Рекорд: <span id="b">0</span></div>
</div>
<div class="controls">Управление: стрелки или WASD</div>
</div>
<div class="overlay" id="o">
<h2 id="ot">Игра окончена</h2>
<p id="op">Ваш счёт: 0</p>
<button class="btn" id="rb">Заново</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=20,N=20;
let sn,dir,nd,food,sc,bs=+localStorage.getItem('snakeBest')||0,run,sp,lt;
document.getElementById('b').textContent=bs;
function init(){sn=[{x:10,y:10}];dir={x:1,y:0};nd={x:1,y:0};sc=0;sp=150;run=true;food=rf();document.getElementById('s').textContent=0;document.getElementById('o').classList.remove('show');lt=0;requestAnimationFrame(loop)}
function rf(){let f;do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(s=>s.x===f.x&&s.y===f.y));return f}
function loop(t){if(!run)return;if(t-lt>sp){lt=t;upd()}drw();requestAnimationFrame(loop)}
function upd(){dir=nd;let h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.x>=N||h.y<0||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){go();return}
sn.unshift(h);
if(h.x===food.x&&h.y===food.y){sc+=10;document.getElementById('s').textContent=sc;if(sc>bs){bs=sc;localStorage.setItem('snakeBest',bs);document.getElementById('b').textContent=bs}food=rf();if(sp>60)sp-=3}else sn.pop()}
function drw(){x.fillStyle='#0a0a1a';x.fillRect(0,0,c.width,c.height);
x.strokeStyle='rgba(233,69,96,.08)';x.lineWidth=1;
for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}
x.fillStyle='#e94560';x.shadowColor='#e94560';x.shadowBlur=15;
x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,Math.PI*2);x.fill();
x.shadowBlur=0;
sn.forEach((s,i)=>{let r=1-i/(sn.length+5);x.fillStyle=i===0?'#ff6b81':`rgba(233,69,96,${r})`;x.shadowColor='#e94560';x.shadowBlur=i===0?15:5;
x.beginPath();x.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,5);x.fill()});
x.shadowBlur=0}
function go(){run=false;document.getElementById('ot').textContent='Игра окончена';document.getElementById('op').textContent='Ваш счёт: '+sc;document.getElementById('o').classList.add('show')}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();
if((k==='arrowup'||k==='w')&&dir.y!==1)nd={x:0,y:-1};
else if((k==='arrowdown'||k==='s')&&dir.y!==-1)nd={x:0,y:1};
else if((k==='arrowleft'||k==='a')&&dir.x!==1)nd={x:-1,y:0};
else if((k==='arrowright'||k==='d')&&dir.x!==-1)nd={x:1,y:0};
if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()});
document.getElementById('rb').onclick=init;
init();
</script>
</body>
</html>
