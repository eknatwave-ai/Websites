<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Angry Birds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#000;touch-action:none}
#game{position:fixed;inset:0;display:block;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud-item{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:8px 16px;border-radius:14px;font-weight:700;font-size:16px;border:1px solid rgba(255,255,255,.15)}
.hud-item span{color:#ffd54a}
#birdsLeft{display:flex;gap:6px;align-items:center}
.bird-icon{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b6b,#c92a2a);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:20;transition:opacity .4s;padding:20px;text-align:center}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(32px,8vw,64px);font-weight:900;background:linear-gradient(135deg,#ffd54a,#ff6b6b,#c92a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;letter-spacing:2px;filter:drop-shadow(0 4px 20px rgba(255,107,107,.4))}
#overlay p{color:#cbd5e1;font-size:clamp(14px,3vw,18px);margin-bottom:28px;max-width:500px;line-height:1.6}
#overlay button{padding:16px 48px;font-size:18px;font-weight:800;border:none;border-radius:50px;background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(201,42,42,.5);transition:transform .2s,box-shadow .2s;letter-spacing:1px}
#overlay button:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 15px 40px rgba(201,42,42,.7)}
#overlay button:active{transform:translateY(0) scale(.98)}
#subtitle{color:#94a3b8;font-size:14px;margin-top:20px}
#restartBtn{position:fixed;top:12px;right:12px;z-index:15;padding:10px 20px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;transition:background .2s}
#restartBtn:hover{background:rgba(255,107,107,.6)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="hud-item">Очки: <span id="score">0</span></div>
<div class="hud-item" id="birdsLeft"></div>
<div class="hud-item">Уровень: <span id="level">1</span></div>
</div>
<button id="restartBtn">🔄 Заново</button>
<div id="overlay">
<h1>🐦 ANGRY BIRDS</h1>
<p>Перетащи птицу назад, чтобы запустить её в свинок. Уничтожь всех врагов, чтобы пройти уровень!</p>
<button id="playBtn">ИГРАТЬ</button>
<div id="subtitle">Кликни по птице и потяни мышкой</div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
canvas.width=W*DPR;canvas.height=H*DPR;
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

const G=1600;
let score=0,level=1;
let birdsAvailable=3;
let state='menu';
let cameraX=0,cameraTargetX=0;

const groundY=()=>H-60;

class Bird{
constructor(x,y){
this.x=x;this.y=y;this.vx=0;this.vy=0;
this.r=18;this.launched=false;this.dead=false;
this.trail=[];this.rot=0;this.rotSpeed=0;this.sleeping=false;
}
update(dt){
if(!this.launched||this.dead)return;
this.vy+=G*dt;
this.x+=this.vx*dt;this.y+=this.vy*dt;
this.rot+=this.rotSpeed*dt;
this.trail.push({x:this.x,y:this.y,a:1});
if(this.trail.length>30)this.trail.shift();
this.trail.forEach(t=>t.a-=dt*1.5);
const gy=groundY()-this.r;
if(this.y>gy){
this.y=gy;this.vy*=-0.4;this.vx*=0.7;
if(Math.abs(this.vy)<40){this.vy=0;this.sleeping=true;this.rotSpeed=0}
}
if(this.x>W+400||this.x<-400||this.y>H+400)this.dead=true;
if(this.sleeping&&Math.abs(this.vx)<10)this.dead=true;
}
draw(){
if(this.dead)return;
this.trail.forEach(t=>{
if(t.a<=0)return;
ctx.fillStyle=`rgba(255,255,255,${t.a*0.3})`;
ctx.beginPath();ctx.arc(t.x-cameraX,t.y,this.r*0.4*t.a,0,Math.PI*2);ctx.fill();
});
ctx.save();
ctx.translate(this.x-cameraX,this.y);
ctx.rotate(this.rot);
const grd=ctx.createRadialGradient(-this.r*0.3,-this.r*0.3,2,0,0,this.r);
grd.addColorStop(0,'#ff8787');grd.addColorStop(1,'#c92a2a');
ctx.fillStyle=grd;
ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#7a1818';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#ffd8a8';
ctx.beginPath();ctx.ellipse(0,this.r*0.3,this.r*0.55,this.r*0.4,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(this.r*0.25,-this.r*0.35,this.r*0.32,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(-this.r*0.15,-this.r*0.35,this.r*0.28,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#111';
ctx.beginPath();ctx.arc(this.r*0.32,-this.r*0.35,this.r*0.13,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(-this.r*0.08,-this.r*0.35,this.r*0.12,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(this.r*0.05,-this.r*0.7);ctx.lineTo(this.r*0.5,-this.r*0.5);ctx.stroke();
ctx.beginPath();ctx.moveTo(-this.r*0.4,-this.r*0.65);ctx.lineTo(-this.r*0.05,-this.r*0.55);ctx.stroke();
ctx.fillStyle='#ffa94d';
ctx.beginPath();
ctx.moveTo(this.r*0.55,this.r*0.05);
ctx.lineTo(this.r*1.1,this.r*0.15);
ctx.lineTo(this.r*0.55,this.r*0.35);
ctx.closePath();ctx.fill();
ctx.strokeStyle='#e8590c';ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle='#a61e1e';
ctx.beginPath();
ctx.moveTo(-this.r*0.9,-this.r*0.2);
ctx.lineTo(-this.r*1.5,-this.r*0.5);
ctx.lineTo(-this.r*1.4,this.r*0.2);
ctx.closePath();ctx.fill();
ctx.restore();
}
}

class Pig{
constructor(x,y,size){
this.x=x;this.y=y;this.r=size;this.dead=false;this.hp=size>22?2:1;
this.hurt=0;this.vy=0;this.vx=0;this.settled=false;
}
update(dt){
if(this.dead)return;
this.vy+=G*dt;
this.x+=this.vx*dt;this.y+=this.vy*dt;
const gy=groundY()-this.r;
if(this.y>gy){this.y=gy;this.vy*=-0.3;this.vx*=0.8;
if(Math.abs(this.vy)<50){this.vy=0;this.vx*=0.9;if(Math.abs(this.vx)<10)this.vx=0}
}
if(this.hurt>0)this.hurt-=dt;
}
hit(dmg){
this.hp-=dmg;this.hurt=0.3;
if(this.hp<=0){this.dead=true;score+=this.r>22?500:300;updateHUD()}
}
draw(){
if(this.dead)return;
ctx.save();
ctx.translate(this.x-cameraX,this.y);
const grd=ctx.createRadialGradient(-this.r*0.3,-this.r*0.3,2,0,0,this.r);
if(this.hurt>0){grd.addColorStop(0,'#ffcccc');grd.addColorStop(1,'#ff6b6b')}
else{grd.addColorStop(0,'#a5d8a5');grd.addColorStop(1,'#4a9e4a')}
ctx.fillStyle=grd;
ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#2d6a2d';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#4a9e4a';
ctx.beginPath();ctx.arc(-this.r*0.6,-this.r*0.75,this.r*0.28,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(this.r*0.6,-this.r*0.75,this.r*0.28,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#7bc47b';
ctx.beginPath();ctx.ellipse(0,this.r*0.15,this.r*0.55,this.r*0.42,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#2d6a2d';ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle='#2d6a2d';
ctx.beginPath();ctx.ellipse(-this.r*0.18,this.r*0.15,this.r*0.08,this.r*0.12,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(this.r*0.18,this.r*0.15,this.r*0.08,this.r*0.12,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(-this.r*0.35,-this.r*0.2,this.r*0.22,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(this.r*0.35,-this.r*0.2,this.r*0.22,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#111';
ctx.beginPath();ctx.arc(-this.r*0.3,-this.r*0.2,this.r*0.1,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(this.r*0.4,-this.r*0.2,this.r*0.1,0,Math.PI*2);ctx.fill();
ctx.restore();
}
}

class Block{
constructor(x,y,w,h,type){
this.x=x;this.y=y;this.w=w;this.h=h;this.type=type||'wood';
this.vx=0;this.vy=0;this.rot=0;this.rotSpeed=0;
this.dead=false;this.hp=type==='stone'?100:type==='ice'?25:50;
this.settled=false;
}
update(dt){
if(this.dead)return;
// Если блок "осел" на земле — он не двигается (не танцует)
if(this.settled){
this.vx=0;this.vy=0;this.rotSpeed=0;
return;
}
this.vy+=G*dt;
this.x+=this.vx*dt;this.y+=this.vy*dt;
this.rot+=this.rotSpeed*dt;
const gy=groundY()-this.h/2;
if(this.y>gy){
this.y=gy;
this.vy*=-0.15;
this.vx*=0.6;
this.rotSpeed*=0.4;
if(Math.abs(this.vy)<30&&Math.abs(this.vx)<15&&Math.abs(this.rotSpeed)<0.3){
this.vy=0;this.vx=0;this.rotSpeed=0;
// Выравниваем угол к ближайшему кратному PI/2
this.rot=Math.round(this.rot/(Math.PI/2))*(Math.PI/2);
this.settled=true;
}
}
}
hit(dmg){
this.hp-=dmg;
if(this.hp<=0){this.dead=true;score+=50;updateHUD()}
}
draw(){
if(this.dead)return;
ctx.save();
ctx.translate(this.x-cameraX,this.y);
ctx.rotate(this.rot);
let fill,stroke;
if(this.type==='wood'){fill='#c98a4b';stroke='#8b5a2b'}
else if(this.type==='stone'){fill='#9aa5b1';stroke='#5c6672'}
else{fill='rgba(180,220,255,.8)';stroke='#7ab8e8'}
ctx.fillStyle=fill;
ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
ctx.strokeStyle=stroke;ctx.lineWidth=2;
ctx.strokeRect(-this.w/2,-this.h/2,this.w,this.h);
if(this.type==='wood'){
ctx.strokeStyle='rgba(139,90,43,.5)';ctx.lineWidth=1;
for(let i=1;i<3;i++){
ctx.beginPath();ctx.moveTo(-this.w/2,-this.h/2+i*this.h/3);ctx.lineTo(this.w/2,-this.h/2+i*this.h/3);ctx.stroke();
}
}
if(this.type==='ice'){
ctx.fillStyle='rgba(255,255,255,.5)';
ctx.fillRect(-this.w/2+3,-this.h/2+3,this.w*0.3,this.h*0.5);
}
ctx.restore();
}
}

let birds=[],pigs=[],blocks=[],particles=[];
let currentBird=null,dragging=false,dragStart=null,dragCurrent=null;
let slingX=0,slingY=0;
let pigVisible={x:0,y:0,angle:0}; // Направление, куда смотрит принц (последняя птица)

function updateHUD(){
document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
const bl=document.getElementById('birdsLeft');
bl.innerHTML='';
for(let i=0;i<birdsAvailable;i++){
const d=document.createElement('div');d.className='bird-icon';bl.appendChild(d);
}
}

function setupLevel(){
birds=[];pigs=[];blocks=[];particles=[];
birdsAvailable=3;
slingX=W*0.18;
slingY=groundY()-140;
cameraX=0;cameraTargetX=0;

const baseY=groundY();

if(level===1){
const bx=W*0.72;
blocks.push(new Block(bx,baseY-40,20,80,'wood'));
blocks.push(new Block(bx+70,baseY-40,20,80,'wood'));
blocks.push(new Block(bx+35,baseY-100,110,20,'wood'));
pigs.push(new Pig(bx+35,baseY-30,22));
blocks.push(new Block(bx+35,baseY-140,20,60,'ice'));
pigs.push(new Pig(bx+35,baseY-180,22));
}
else if(level===2){
const bx=W*0.7;
blocks.push(new Block(bx,baseY-40,20,80,'stone'));
blocks.push(new Block(bx+80,baseY-40,20,80,'stone'));
blocks.push(new Block(bx+40,baseY-100,120,20,'wood'));
pigs.push(new Pig(bx+40,baseY-30,22));
blocks.push(new Block(bx+40,baseY-140,20,60,'ice'));
pigs.push(new Pig(bx+40,baseY-180,22));
blocks.push(new Block(bx+90,baseY-40,20,80,'wood'));
pigs.push(new Pig(bx+120,baseY-30,22));
}
else{
const bx=W*0.68;
for(let i=0;i<4;i++){
blocks.push(new Block(bx+i*55,baseY-40,18,80,i%2?'wood':'stone'));
}
blocks.push(new Block(bx+80,baseY-100,180,20,'wood'));
blocks.push(new Block(bx+80,baseY-140,20,60,'ice'));
pigs.push(new Pig(bx+30,baseY-30,22));
pigs.push(new Pig(bx+80,baseY-30,22));
pigs.push(new Pig(bx+130,baseY-30,22));
pigs.push(new Pig(bx+80,baseY-180,22));
}

spawnBird();
updateHUD();
}

function spawnBird(){
if(birdsAvailable<=0)return;
currentBird=new Bird(slingX,slingY);
birds.push(currentBird);
}

function launchBird(vx,vy){
if(!currentBird)return;
currentBird.launched=true;
currentBird.vx=vx;currentBird.vy=vy;
currentBird.rotSpeed=0.5;
birdsAvailable--;
updateHUD();
currentBird=null;
}

function checkLevelComplete(){
if(pigs.every(p=>p.dead)){
setTimeout(()=>{
level++;
if(level>3){level=1;score+=2000;}
setupLevel();
},800);
return true;
}
return false;
}

function checkLevelFailed(){
if(birdsAvailable<=0&&!currentBird){
const anyActive=birds.some(b=>b.launched&&!b.dead);
if(!anyActive&&!pigs.every(p=>p.dead)){
setTimeout(()=>{
if(pigs.every(p=>p.dead))return;
alert('Уровень провален! Попробуем снова.');
setupLevel();
},1500);
}
}
}

function getPos(e){
const r=canvas.getBoundingClientRect();
const t=e.touches?e.touches[0]:e;
return{x:t.clientX-r.left,y:t.clientY-r.top};
}

function onDown(e){
e.preventDefault();
if(state!=='playing')return;
const p=getPos(e);
if(currentBird&&!currentBird.launched){
const dx=p.x-(currentBird.x-cameraX);
const dy=p.y-currentBird.y;
if(dx*dx+dy*dy<60*60){
dragging=true;
dragStart={x:currentBird.x,y:currentBird.y};
dragCurrent={x:p.x+cameraX,y:p.y};
}
}
}

function onMove(e){
if(!dragging)return;
e.preventDefault();
const p=getPos(e);
dragCurrent={x:p.x+cameraX,y:p.y};
}

function onUp(e){
if(!dragging)return;
dragging=false;
if(!currentBird)return;
const dx=currentBird.x-dragCurrent.x;
const dy=currentBird.y-dragCurrent.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<15){dragStart=null;dragCurrent=null;return}
const power=Math.min(dist,180);
const angle=Math.atan2(dy,dx);
const speed=power*10;
launchBird(Math.cos(angle)*speed,Math.sin(angle)*speed);
dragStart=null;dragCurrent=null;
}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});

function circleRect(cx,cy,cr,rx,ry,rw,rh,rot){
const cos=Math.cos(-rot),sin=Math.sin(-rot);
const dx=cx-rx,dy=cy-ry;
const lx=dx*cos-dy*sin;
const ly=dx*sin+dy*cos;
const closestX=Math.max(-rw/2,Math.min(rw/2,lx));
const closestY=Math.max(-rh/2,Math.min(rh/2,ly));
const ddx=lx-closestX,ddy=ly-closestY;
return ddx*ddx+ddy*ddy<cr*cr;
}

function resolveCollisions(){
birds.forEach(b=>{
if(!b.launched||b.dead)return;
pigs.forEach(p=>{
if(p.dead)return;
const dx=b.x-p.x,dy=b.y-p.y;
const d=Math.sqrt(dx*dx+dy*dy);
const minD=b.r+p.r;
if(d<minD&&d>0){
const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
p.hit(speed>400?2:1);
p.vx=(dx/d)*speed*0.5;
p.vy=(dy/d)*speed*0.3-100;
b.vx*=-0.3;b.vy*=-0.3;
b.x=p.x+(dx/d)*minD;
b.y=p.y+(dy/d)*minD;
for(let i=0;i<8;i++)spawnParticle(p.x,p.y,'#a5d8a5');
}
});
blocks.forEach(bl=>{
if(bl.dead)return;
if(circleRect(b.x,b.y,b.r,bl.x,bl.y,bl.w,bl.h,bl.rot)){
const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
if(speed>250){
bl.hit(speed>500?3:1);
bl.vx=(b.vx)*0.3;
bl.vy=(b.vy)*0.3;
bl.rotSpeed=(Math.random()-0.5)*3;
bl.settled=false; // разрушаем "сон" при ударе
for(let i=0;i<6;i++)spawnParticle(bl.x,bl.y,bl.type==='ice'?'#b4dcff':'#c98a4b');
}
b.vx*=0.5;b.vy*=0.5;
}
});
});
blocks.forEach(bl=>{
if(bl.dead)return;
pigs.forEach(p=>{
if(p.dead)return;
if(circleRect(p.x,p.y,p.r,bl.x,bl.y,bl.w,bl.h,bl.rot)){
const speed=Math.sqrt(bl.vx*bl.vx+bl.vy*bl.vy);
if(speed>300){
p.hit(1);
p.vx=bl.vx*0.5;
p.vy=bl.vy*0.3-80;
}
}
});
});
}

function spawnParticle(x,y,color){
particles.push({x,y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300-100,life:0.6,maxLife:0.6,color,size:Math.random()*4+2});
}

function updateParticles(dt){
particles.forEach(p=>{
p.vy+=G*0.5*dt;
p.x+=p.vx*dt;p.y+=p.vy*dt;
p.life-=dt;
});
particles=particles.filter(p=>p.life>0);
}

function drawParticles(){
particles.forEach(p=>{
ctx.globalAlpha=p.life/p.maxLife;
ctx.fillStyle=p.color;
ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.size,0,Math.PI*2);ctx.fill();
});
ctx.globalAlpha=1;
}

function drawBackground(){
const sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,'#87ceeb');
sky.addColorStop(0.6,'#b8e0f0');
sky.addColorStop(1,'#d4f0d4');
ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,230,120,.9)';
ctx.beginPath();ctx.arc(W*0.85,80,50,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(255,255,180,.4)';
ctx.beginPath();ctx.arc(W*0.85,80,75,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.85)';
const cloudOffset=(cameraX*0.2)%(W+400);
drawCloud(W*0.15-cloudOffset+W+400,90,60);
drawCloud(W*0.5-cloudOffset+W+400,60,40);
drawCloud(W*0.8-cloudOffset+W+400,120,50);
drawCloud(W*0.15-cloudOffset+W*2+400,90,60);
ctx.fillStyle='#7bc47b';
ctx.beginPath();
ctx.moveTo(0,groundY());
for(let x=0;x<=W;x+=40){
const h=Math.sin((x+cameraX*0.3)*0.005)*40+60;
ctx.lineTo(x,groundY()-h);
}
ctx.lineTo(W,groundY());
ctx.closePath();ctx.fill();
const groundGrad=ctx.createLinearGradient(0,groundY(),0,H);
groundGrad.addColorStop(0,'#8b5a2b');
groundGrad.addColorStop(1,'#5c3a1a');
ctx.fillStyle=groundGrad;
ctx.fillRect(0,groundY(),W,H-groundY());
ctx.fillStyle='#4a9e4a';
ctx.fillRect(0,groundY()-8,W,10);
ctx.strokeStyle='#3d8a3d';ctx.lineWidth=2;
for(let x=0;x<W;x+=15){
const ox=(x-cameraX*0.5)%W;
ctx.beginPath();
ctx.moveTo(ox,groundY()-8);
ctx.lineTo(ox+3,groundY()-14);
ctx.stroke();
}
}

function drawCloud(x,y,r){
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.arc(x+r*0.8,y-r*0.3,r*0.7,0,Math.PI*2);
ctx.arc(x-r*0.8,y-r*0.2,r*0.6,0,Math.PI*2);
ctx.arc(x+r*0.3,y-r*0.7,r*0.6,0,Math.PI*2);
ctx.fill();
}

function drawSling(){
const sx=slingX-cameraX;
const sy=slingY;
ctx.strokeStyle='#6b3a1a';ctx.lineWidth=8;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(sx-5,groundY());ctx.lineTo(sx-5,sy+30);ctx.stroke();
ctx.beginPath();ctx.moveTo(sx+5,groundY());ctx.lineTo(sx+5,sy+30);ctx.stroke();
ctx.strokeStyle='#8b5a2b';ctx.lineWidth=10;
ctx.beginPath();ctx.moveTo(sx-5,sy+30);ctx.lineTo(sx-15,sy-10);ctx.stroke();
ctx.beginPath();ctx.moveTo(sx+5,sy+30);ctx.lineTo(sx+15,sy-10);ctx.stroke();
if(currentBird&&!currentBird.launched){
const bx=currentBird.x-cameraX;
const by=currentBird.y;
ctx.strokeStyle='#3d2b1a';ctx.lineWidth=5;
ctx.beginPath();
ctx.moveTo(sx-15,sy-10);
ctx.lineTo(bx,by);
ctx.lineTo(sx+15,sy-10);
ctx.stroke();
}else{
ctx.strokeStyle='#3d2b1a';ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(sx-15,sy-10);ctx.lineTo(sx+15,sy-10);ctx.stroke();
}
}

function drawTrajectory(){
if(!dragging||!currentBird)return;
const dx=currentBird.x-dragCurrent.x;
const dy=currentBird.y-dragCurrent.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<15)return;
const power=Math.min(dist,180);
const angle=Math.atan2(dy,dx);
const speed=power*10;
const vx=Math.cos(angle)*speed;
const vy=Math.sin(angle)*speed;
let px=currentBird.x,py=currentBird.y,pvx=vx,pvy=vy;
ctx.fillStyle='rgba(255,255,255,.7)';
for(let i=0;i<25;i++){
const dt=0.05;
pvy+=G*dt;
px+=pvx*dt;py+=pvy*dt;
if(py>groundY())break;
ctx.beginPath();
ctx.arc(px-cameraX,py,3-i*0.08,0,Math.PI*2);
ctx.fill();
}
ctx.strokeStyle='rgba(255,255,255,.5)';
ctx.lineWidth=2;
ctx.setLineDash([5,5]);
ctx.beginPath();
ctx.moveTo(currentBird.x-cameraX,currentBird.y);
ctx.lineTo(dragCurrent.x-cameraX,dragCurrent.y);
ctx.stroke();
ctx.setLineDash([]);
}

let lastTime=performance.now();
function loop(now){
const dt=Math.min((now-lastTime)/1000,0.033);
lastTime=now;

if(state==='playing'){
birds.forEach(b=>b.update(dt));
pigs.forEach(p=>p.update(dt));
blocks.forEach(b=>b.update(dt));
updateParticles(dt);
resolveCollisions();

if(currentBird&&currentBird.launched){
cameraTargetX=Math.max(0,currentBird.x-W*0.4);
}else if(birds.length>0){
const lastBird=birds[birds.length-1];
if(lastBird.launched&&!lastBird.dead){
cameraTargetX=Math.max(0,lastBird.x-W*0.4);
}else{
cameraTargetX=0;
}
}
cameraX+=(cameraTargetX-cameraX)*0.08;

if(!currentBird&&birdsAvailable>0){
const allDone=birds.every(b=>b.dead||(b.launched&&b.sleeping));
if(allDone&&birds.length>0){
setTimeout(()=>{
if(!currentBird&&birdsAvailable>0&&state==='playing')spawnBird();
},400);
}
}

checkLevelComplete();
checkLevelFailed();
}

drawBackground();
drawSling();
blocks.forEach(b=>b.draw());
pigs.forEach(p=>p.draw());
birds.forEach(b=>b.draw());
drawTrajectory();
drawParticles();

requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('playBtn').addEventListener('click',()=>{
document.getElementById('overlay').classList.add('hidden');
state='playing';
score=0;level=1;
setupLevel();
});

document.getElementById('restartBtn').addEventListener('click',()=>{
score=0;level=1;
setupLevel();
state='playing';
document.getElementById('overlay').classList.add('hidden');
});

updateHUD();
</script>
</body>
</html>
