<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Змейка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Segoe UI',sans-serif;color:#fff;gap:20px;padding:20px}
h1{font-size:2rem;background:linear-gradient(90deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.info{display:flex;gap:30px;font-size:1.1rem}
.info span{color:#00d4ff;font-weight:bold}
canvas{background:#0a0a1a;border-radius:12px;box-shadow:0 0 30px rgba(0,212,255,.3),0 0 60px rgba(123,47,247,.2);border:2px solid rgba(0,212,255,.3)}
.overlay{position:absolute;display:none;flex-direction:column;align-items:center;gap:15px;background:rgba(10,10,26,.95);padding:30px 50px;border-radius:16px;border:2px solid #00d4ff;box-shadow:0 0 40px rgba(0,212,255,.5)}
.overlay.show{display:flex}
.overlay h2{font-size:1.8rem;color:#00d4ff}
.overlay p{color:#aaa}
button{padding:12px 30px;font-size:1rem;font-weight:bold;color:#fff;background:linear-gradient(90deg,#00d4ff,#7b2ff7);border:none;border-radius:8px;cursor:pointer;transition:.3s;letter-spacing:1px}
button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,212,255,.6)}
.wrap{position:relative;display:flex;align-items:center;justify-content:center}
.controls{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;margin-top:10px}
.controls button{padding:0;font-size:1.5rem;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.4)}
.controls button:hover{background:rgba(0,212,255,.35)}
.controls .up{grid-column:2}
.controls .left{grid-column:1;grid-row:2}
.controls .down{grid-column:2;grid-row:2}
.controls .right{grid-column:3;grid-row:2}
@media(min-width:700px){.controls{display:none}}
</style>
</head>
<body>
<h1>🐍 ЗМЕЙКА</h1>
<div class="info">Счёт: <span id="score">0</span> Рекорд: <span id="best">0</span></div>
<div class="wrap">
<canvas id="c" width="400" height="400"></canvas>
<div class="overlay show" id="ov">
<h2 id="ovt">Змейка</h2>
<p id="ovp">Управление: стрелки или WASD</p>
<button id="btn">Играть</button>
</div>
</div>
<div class="controls">
<button class="up" data-d="up">▲</button>
<button class="left" data-d="left">◀</button>
<button class="down" data-d="down">▼</button>
<button class="right" data-d="right">▶</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=20,N=20;
const sc=document.getElementById('score'),bs=document.getElementById('best'),ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),btn=document.getElementById('btn');
let snake,dir,nd,food,score,best=+localStorage.getItem('snakeBest')||0,run=false,timer,speed;
bs.textContent=best;
function init(){snake=[{x:10,y:10}];dir={x:1,y:0};nd={x:1,y:0};score=0;speed=140;sc.textContent=0;placeFood();}
function placeFood(){let ok;do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};ok=!snake.some(s=>s.x===food.x&&s.y===food.y)}while(!ok)}
function draw(){
x.fillStyle='#0a0a1a';x.fillRect(0,0,c.width,c.height);
x.strokeStyle='rgba(0,212,255,.06)';x.lineWidth=1;
for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}
x.fillStyle='#ff3366';x.shadowColor='#ff3366';x.shadowBlur=15;
x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);x.fill();
x.shadowBlur=0;
snake.forEach((s,i)=>{
const t=i/snake.length;
x.fillStyle=i===0?'#00d4ff':`hsl(${190+t*80},100%,${60-t*20}%)`;
x.shadowColor=x.fillStyle;x.shadowBlur=i===0?15:5;
x.beginPath();x.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,i===0?8:5);x.fill();
});
x.shadowBlur=0;
}
function step(){
dir=nd;
const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){gameOver();return}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;sc.textContent=score;if(score%5===0&&speed>60)speed-=10;placeFood()}else snake.pop();
draw();
}
function loop(){if(!run)return;step();timer=setTimeout(loop,speed)}
function start(){init();run=true;ov.classList.remove('show');draw();clearTimeout(timer);loop()}
function gameOver(){run=false;clearTimeout(timer);if(score>best){best=score;localStorage.setItem('snakeBest',best);bs.textContent=best}ovt.textContent='Игра окончена';ovp.textContent='Счёт: '+score;btn.textContent='Заново';ov.classList.add('show')}
btn.onclick=start;
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
function setDir(d){
if(d==='up'&&dir.y!==1)nd={x:0,y:-1};
else if(d==='down'&&dir.y!==-1)nd={x:0,y:1};
else if(d==='left'&&dir.x!==1)nd={x:-1,y:0};
else if(d==='right'&&dir.x!==-1)nd={x:1,y:0};
}
document.addEventListener('keydown',e=>{const d=keys[e.key];if(d){e.preventDefault();setDir(d)}});
document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>setDir(b.dataset.d));
init();draw();
</script>
</body>
</html>
