<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космический Страж</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 20% 10%,#1a0b33 0%,#0a0518 60%,#02010a 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',Roboto,system-ui,sans-serif;padding:16px;color:#e8ddff}
.arcade-wrapper{background:rgba(15,10,30,.9);backdrop-filter:blur(8px);border-radius:48px;padding:40px 26px;box-shadow:0 25px 50px rgba(0,0,0,.8),inset 0 1px 4px rgba(255,255,255,.08);border:1px solid #4a2e6a;max-width:560px;width:100%;text-align:center}
.arcade-title{font-size:1.6rem;font-weight:800;color:#7af0ff;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px #7af0ff80;margin-bottom:12px}
.arcade-sub{font-size:.9rem;color:#6b5a8a;letter-spacing:.5px}
.stats{display:flex;justify-content:space-between;margin:18px 0 10px;font-size:.95rem;color:#a8c8ff;letter-spacing:1px;font-weight:600;gap:8px;flex-wrap:wrap}
.stats span{color:#ff7ad9;text-shadow:0 0 10px #ff7ad980}
.stats .lv{color:#7aff9a;text-shadow:0 0 10px #7aff9a80}
.stats .combo{color:#ffd97a;text-shadow:0 0 10px #ffd97a80}
#gameCanvas{width:100%;max-width:480px;height:auto;background:linear-gradient(180deg,#050210 0%,#0a0520 100%);border-radius:20px;border:1px solid #3a2a5a;box-shadow:inset 0 0 40px #00000080,0 0 30px #7af0ff20;display:block;margin:0 auto;touch-action:none}
.controls{margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{background:linear-gradient(180deg,#2a5fd1,#1a3a8a);color:#e7f2ff;border:1px solid #5a9aff;border-radius:14px;padding:12px 26px;font-size:.95rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px #2a5fd150,inset 0 1px 2px #ffffff30;transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 24px #7af0ff70,inset 0 1px 2px #ffffff40}
button:active{transform:translateY(0)}
button.danger{background:linear-gradient(180deg,#d12a5f,#8a1a3a);border-color:#ff5a9a}
button.danger:hover{box-shadow:0 10px 24px #ff7ad970,inset 0 1px 2px #ffffff40}
.hint{margin-top:14px;font-size:.78rem;color:#5a4a7a;letter-spacing:.5px;line-height:1.6}
.hint b{color:#a8c8ff}
</style>
</head>
<body>
<div class="arcade-wrapper">
<div class="arcade-title">Космический Страж</div>
<div class="arcade-sub">Управляй кораблём, собирай энергию, уничтожай врагов</div>
<div class="stats">
<div>Счёт: <span id="score">0</span></div>
<div>Уровень: <span class="lv" id="level">1</span></div>
<div>Комбо: <span class="combo" id="combo">x1</span></div>
</div>
<div class="stats">
<div>Рекорд: <span id="best">0</span></div>
<div>Жизни: <span id="lives">3</span></div>
<div>Щит: <span id="shield">0</span></div>
</div>
<canvas id="gameCanvas" width="480" height="480"></canvas>
<div class="controls">
<button id="startBtn">Старт</button>
<button id="pauseBtn">Пауза</button>
<button id="soundBtn">Звук: Вкл</button>
</div>
<div class="hint">
<b>Управление:</b> мышь / палец / ← → / A D<br>
<b>Пробел</b> — пауза · <b>P</b> — пауза · <b>M</b> — звук · <b>R</b> — рестарт<br>
Собирай <b>энергию</b>, лови <b>бонусы</b> (щит, тройной выстрел, жизнь), избегай врагов!
</div>
</div>
<script>
(function(){
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const livesEl=document.getElementById('lives');
const levelEl=document.getElementById('level');
const comboEl=document.getElementById('combo');
const shieldEl=document.getElementById('shield');
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');
const soundBtn=document.getElementById('soundBtn');

const W=canvas.width, H=canvas.height;
const player={x:W/2,y:H-45,w:60,h:60,speed:7};
let keys={left:false,right:false};
let pointerX=null;
let running=false, paused=false, gameOver=false;
let score=0, lives=3, best=Number(localStorage.getItem('neonBest')||0);
let level=1, combo=1, comboTimer=0, shield=0;
bestEl.textContent=best;

// Audio
let soundOn = localStorage.getItem('neonSound')!=='off';
soundBtn.textContent = 'Звук: ' + (soundOn?'Вкл':'Выкл');
let audioCtx=null;
function beep(freq,dur,type,vol){
  if(!soundOn)return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type||'square';
    o.frequency.value=freq;
    g.gain.value=vol||0.05;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

const shipImg=new Image();
shipImg.crossOrigin='anonymous';
shipImg.src='https://i.ibb.co/99jBYCmD/574c2e0d1c3d.jpg';
let shipLoaded=false;
shipImg.onload=()=>{shipLoaded=true;};

let items=[];
let bullets=[];
let particles=[];
let stars=[];
let powerups=[];
let spawnTimer=0, spawnInterval=50;
let shootTimer=0;
let frame=0;
let tripleShotTimer=0;
let invulnTimer=0;
let screenShake=0;

for(let i=0;i<80;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5,speed:Math.random()*1.5+0.3});
}

function reset(){
  score=0;lives=3;items=[];bullets=[];particles=[];powerups=[];
  spawnTimer=0;spawnInterval=50;shootTimer=0;frame=0;
  level=1;combo=1;comboTimer=0;shield=0;tripleShotTimer=0;invulnTimer=0;screenShake=0;
  player.x=W/2;
  scoreEl.textContent=0;livesEl.textContent=3;levelEl.textContent=1;
  comboEl.textContent='x1';shieldEl.textContent=0;
  gameOver=false;
}

function spawn(){
  const r=Math.random();
  let type='energy';
  if(r<0.28) type='enemy';
  else if(r<0.38) type='bigEnemy';
  else if(r<0.42) type='powerup';
  items.push({
    x:30+Math.random()*(W-60),
    y:-30,
    r:type==='enemy'?16:(type==='bigEnemy'?24:(type==='powerup'?14:12)),
    vy:type==='bigEnemy'?1.8+Math.random()*0.8:2.2+Math.random()*1.2,
    vx:(Math.random()-0.5)*1.5,
    type:type,
    hp:type==='bigEnemy'?3:1,
    phase:Math.random()*Math.PI*2,
    puType: type==='powerup'?['shield','triple','life'][Math.floor(Math.random()*3)]:null
  });
}

function addParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,maxLife:30,color,size:2+Math.random()*3});
  }
}

function shoot(){
  if(tripleShotTimer>0){
    bullets.push({x:player.x,y:player.y-20,vy:-9});
    bullets.push({x:player.x-14,y:player.y-16,vy:-9,vx:-1.5});
    bullets.push({x:player.x+14,y:player.y-16,vy:-9,vx:1.5});
  }else{
    bullets.push({x:player.x-12,y:player.y-20,vy:-9});
    bullets.push({x:player.x+12,y:player.y-20,vy:-9});
  }
  beep(880,0.04,'square',0.02);
}

function update(){
  frame++;
  if(keys.left) player.x-=player.speed;
  if(keys.right) player.x+=player.speed;
  if(pointerX!==null){
    const diff=pointerX-player.x;
    player.x+=Math.max(-player.speed,Math.min(player.speed,diff*0.35));
  }
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));

  if(tripleShotTimer>0) tripleShotTimer--;
  if(invulnTimer>0) invulnTimer--;
  if(screenShake>0) screenShake*=0.9;

  if(comboTimer>0){comboTimer--;if(comboTimer===0){combo=1;comboEl.textContent='x1';}}

  shootTimer++;
  if(shootTimer>12){shootTimer=0;shoot();}

  spawnTimer++;
  const interval=Math.max(20,spawnInterval-frame*0.05);
  if(spawnTimer>interval){spawnTimer=0;spawn();}

  // level up every 30 score
  const newLevel = 1 + Math.floor(score/30);
  if(newLevel!==level){
    level=newLevel;
    levelEl.textContent=level;
    beep(1200,0.1,'sine',0.06);
    addParticles(W/2,H/2,'#7aff9a',30);
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.y+=b.vy;
    if(b.vx) b.x+=b.vx;
    if(b.y<-20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    for(let j=items.length-1;j>=0;j--){
      const it=items[j];
      if(it.type==='energy'||it.type==='powerup')continue;
      const dx=Math.abs(b.x-it.x), dy=Math.abs(b.y-it.y);
      if(dx<it.r && dy<it.r){
        it.hp--;
        addParticles(b.x,b.y,'#7af0ff',6);
        bullets.splice(i,1);
        if(it.hp<=0){
          const basePts=it.type==='bigEnemy'?5:2;
          const pts=basePts*combo;
          score+=pts;
          scoreEl.textContent=score;
          addParticles(it.x,it.y,'#ff4d6d',20);
          items.splice(j,1);
          beep(220,0.08,'sawtooth',0.04);
          // combo
          combo=Math.min(combo+1,10);
          comboTimer=120;
          comboEl.textContent='x'+combo;
        }
        break;
      }
    }
  }

  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.y+=it.vy;
    it.x+=it.vx;
    it.phase+=0.1;
    if(it.x<20||it.x>W-20) it.vx*=-1;

    const dx=Math.abs(it.x-player.x), dy=Math.abs(it.y-player.y);
    if(dx<player.w/2+it.r-10 && dy<player.h/2+it.r-10){
      if(it.type==='energy'){
        score+=combo;
        scoreEl.textContent=score;
        addParticles(it.x,it.y,'#7af0ff',12);
        items.splice(i,1);
        beep(660,0.05,'sine',0.03);
      }else if(it.type==='powerup'){
        if(it.puType==='shield'){shield=Math.min(shield+1,3);shieldEl.textContent=shield;}
        else if(it.puType==='triple'){tripleShotTimer=300;}
        else if(it.puType==='life'){lives++;livesEl.textContent=lives;}
        addParticles(it.x,it.y,'#ffd97a',18);
        items.splice(i,1);
        beep(1400,0.15,'sine',0.07);
      }else{
        if(invulnTimer>0){continue;}
        if(shield>0){
          shield--;
          shieldEl.textContent=shield;
          invulnTimer=60;
          addParticles(it.x,it.y,'#7aff9a',22);
          items.splice(i,1);
          beep(300,0.15,'sine',0.05);
          screenShake=8;
        }else{
          lives--;
          livesEl.textContent=lives;
          addParticles(it.x,it.y,'#ff4d6d',22);
          items.splice(i,1);
          invulnTimer=90;
          screenShake=15;
          beep(120,0.3,'sawtooth',0.08);
          combo=1;comboEl.textContent='x1';
          if(lives<=0){endGame();return;}
        }
      }
      continue;
    }
    if(it.y-it.r>H){
      items.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}

function drawShip(x,y,size){
  ctx.save();
  ctx.shadowBlur=25;
  ctx.shadowColor='#7af0ff';
  ctx.translate(x,y);
  if(invulnTimer>0 && Math.floor(invulnTimer/4)%2===0){
    ctx.globalAlpha=0.4;
  }
  if(shipLoaded){
    ctx.drawImage(shipImg,-size/2,-size/2,size,size);
  }else{
    ctx.fillStyle='#7af0ff';
    ctx.beginPath();
    ctx.moveTo(0,-size/2);
    ctx.lineTo(size/2,size/2);
    ctx.lineTo(0,size/3);
    ctx.lineTo(-size/2,size/2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // shield ring
  if(shield>0){
    ctx.save();
    ctx.strokeStyle='#7aff9a';
    ctx.shadowBlur=20;
    ctx.shadowColor='#7aff9a';
    ctx.lineWidth=2;
    for(let s=0;s<shield;s++){
      ctx.beginPath();
      ctx.arc(x,y,size/2+8+s*6,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  if(screenShake>0.5){
    ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);
  }

  for(const s of stars){
    s.y+=s.speed;
    if(s.y>H){s.y=0;s.x=Math.random()*W;}
    ctx.fillStyle='rgba(160,220,255,'+(0.3+s.s*0.3)+')';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }

  for(const b of bullets){
    ctx.save();
    ctx.shadowBlur=15;
    ctx.shadowColor='#7af0ff';
    ctx.fillStyle='#e6ffff';
    ctx.fillRect(b.x-2,b.y-10,4,14);
    ctx.restore();
  }

  for(const it of items){
    ctx.save();
    ctx.shadowBlur=20;
    if(it.type==='energy'){
      ctx.shadowColor='#7af0ff';
      const grad=ctx.createRadialGradient(it.x,it.y,1,it.x,it.y,it.r);
      grad.addColorStop(0,'#e6ffff');
      grad.addColorStop(1,'#22c7e0');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#b3ffff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r+3+Math.sin(it.phase)*2,0,Math.PI*2);
      ctx.stroke();
    }else if(it.type==='enemy'){
      ctx.shadowColor='#ff4d6d';
      ctx.fillStyle='#ff4d6d';
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#ffb3c1';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r+4+Math.sin(it.phase)*2,0,Math.PI*2);
      ctx.stroke();
    }else if(it.type==='bigEnemy'){
      ctx.shadowColor='#ff00aa';
      ctx.fillStyle='#ff00aa';
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#ffb3e6';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(it.x,it.y,it.r+5+Math.sin(it.phase)*3,0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.font='bold 14px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(it.hp,it.x,it.y);
    }else if(it.type==='powerup'){
      ctx.shadowColor='#ffd97a';
      ctx.fillStyle='#ffd97a';
      const rot=it.phase;
      ctx.translate(it.x,it.y);
      ctx.rotate(rot);
      ctx.beginPath();
      for(let k=0;k<5;k++){
        const a=k*Math.PI*2/5 - Math.PI/2;
        const a2=a+Math.PI/5;
        ctx.lineTo(Math.cos(a)*it.r,Math.sin(a)*it.r);
        ctx.lineTo(Math.cos(a2)*it.r*0.45,Math.sin(a2)*it.r*0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#fff5cc';
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.font='bold 10px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.rotate(-rot);
      const lbl = it.puType==='shield'?'S':(it.puType==='triple'?'T':'+');
      ctx.fillText(lbl,0,0);
    }
    ctx.restore();
  }

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  drawShip(player.x,player.y,player.w);

  ctx.restore();

  if(tripleShotTimer>0){
    ctx.save();
    ctx.fillStyle='#ffd97a';
    ctx.font='bold 12px sans-serif';
    ctx.textAlign='left';
    ctx.fillText('TRIPLE '+Math.ceil(tripleShotTimer/60)+'s',10,20);
    ctx.restore();
  }

  if(gameOver){
    ctx.fillStyle='rgba(5,2,15,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff7ad9';
    ctx.font='bold 38px Segoe UI, sans-serif';
    ctx.textAlign='center';
    ctx.shadowBlur=25;
    ctx.shadowColor='#ff7ad9';
    ctx.fillText('ИГРА ОКОНЧЕНА',W/2,H/2-40);
    ctx.shadowBlur=0;
    ctx.fillStyle='#a8c8ff';
    ctx.font='18px Segoe UI, sans-serif';
    ctx.fillText('Счёт: '+score,W/2,H/2);
    ctx.fillText('Уровень: '+level,W/2,H/2+28);
    ctx.fillText('Рекорд: '+best,W/2,H/2+56);
    ctx.fillStyle='#7af0ff';
    ctx.fillText('Нажмите Старт или R',W/2,H/2+90);
  }else if(paused){
    ctx.fillStyle='rgba(5,2,15,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#7af0ff';
    ctx.font='bold 32px Segoe UI, sans-serif';
    ctx.textAlign='center';
    ctx.shadowBlur=20;
    ctx.shadowColor='#7af0ff';
    ctx.fillText('ПАУЗА',W/2,H/2);
    ctx.shadowBlur=0;
  }
}

function loop(){
  if(running && !paused && !gameOver){
    update();
  }
  draw();
  requestAnimationFrame(loop);
}

function endGame(){
  gameOver=true;
  running=false;
  if(score>best){best=score;localStorage.setItem('neonBest',best);bestEl.textContent=best;}
  beep(80,0.6,'sawtooth',0.1);
}

function startGame(){
  reset();
  running=true;
  paused=false;
  pauseBtn.textContent='Пауза';
  if(!loopStarted){loopStarted=true;loop();}
  beep(440,0.1,'sine',0.05);
}

let loopStarted=false;

startBtn.addEventListener('click',startGame);
pauseBtn.addEventListener('click',()=>{
  if(!running||gameOver)return;
  paused=!paused;
  pauseBtn.textContent=paused?'Продолжить':'Пауза';
});
soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn;
  localStorage.setItem('neonSound',soundOn?'on':'off');
  soundBtn.textContent='Звук: '+(soundOn?'Вкл':'Выкл');
  if(soundOn) beep(880,0.08,'sine',0.05);
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  if(e.key===' '||e.key==='p'||e.key==='P'){e.preventDefault();pauseBtn.click();}
  if(e.key==='m'||e.key==='M'){soundBtn.click();}
  if(e.key==='r'||e.key==='R'){startGame();}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});

function canvasPos(e){
  const rect=canvas.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  return cx*(W/rect.width);
}
canvas.addEventListener('mousemove',e=>{pointerX=canvasPos(e);});
canvas.addEventListener('mouseleave',()=>{pointerX=null;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();pointerX=canvasPos(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();pointerX=canvasPos(e);},{passive:false});
canvas.addEventListener('touchend',()=>{pointerX=null;});

draw();
})();
</script>
</body>
</html>
