<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра: переделка · Змейка-лабиринт</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
    }
    .game-wrapper {
      background: rgba(18, 30, 41, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 48px;
      padding: 28px 28px 32px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.08);
      border: 1px solid #3e5e7a;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 8px;
    }
    .score-box {
      background: #0f1c26;
      padding: 10px 24px;
      border-radius: 60px;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(255, 255, 255, 0.05);
      color: #b9e6ff;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 1px;
      border: 1px solid #2e4b62;
    }
    .score-box span {
      color: #f5e56b;
      font-weight: 800;
      margin-left: 8px;
      text-shadow: 0 0 8px #f5e56b80;
    }
    .restart-btn {
      background: #1e3347;
      border: none;
      border-radius: 40px;
      padding: 10px 26px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ddf0ff;
      cursor: pointer;
      box-shadow: 0 6px 0 #0a121c, 0 8px 12px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease;
      border: 1px solid #3f637e;
      letter-spacing: 0.5px;
    }
    .restart-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #0a121c, 0 5px 10px rgba(0, 0, 0, 0.5);
    }
    .restart-btn:hover {
      background: #264a64;
      color: #ffffff;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 28px;
      box-shadow: 0 0 0 2px #1e3a4e, 0 20px 30px -5px black;
      background: #0b141c;
      width: 100%;
      height: auto;
      max-width: 500px;
      aspect-ratio: 1 / 1;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .arrow {
      background: #1b2d3b;
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 30px;
      font-size: 2.2rem;
      font-weight: 700;
      color: #b1d9f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #0b131b, 0 10px 16px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.06s ease;
      border: 1px solid #3b5e78;
      user-select: none;
    }
    .arrow:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #0b131b, 0 6px 12px rgba(0, 0, 0, 0.5);
    }
    .arrow:hover {
      background: #254b62;
      color: #ffffff;
    }
    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #aacce4;
      text-shadow: 0 2px 4px black;
      min-height: 2rem;
      letter-spacing: 0.3px;
    }
    @media (max-width: 480px) {
      .game-wrapper { padding: 18px; }
      .arrow { width: 60px; height: 60px; font-size: 1.8rem; }
      .score-box { font-size: 1.2rem; padding: 8px 18px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score-box">🍎 <span id="scoreDisplay">0</span></div>
    <button class="restart-btn" id="restartButton">⟳ Заново</button>
  </div>
  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <div class="controls">
    <button class="arrow" data-dir="up">▲</button>
    <button class="arrow" data-dir="left">◀</button>
    <button class="arrow" data-dir="down">▼</button>
    <button class="arrow" data-dir="right">▶</button>
  </div>
  <div class="status" id="statusMessage">Управляй змейкой — собирай яблоки</div>
</div>
<script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const statusDiv = document.getElementById('statusMessage');

    const GRID_SIZE = 20;          // 20x20 клеток
    const CELL_SIZE = canvas.width / GRID_SIZE; // 25px

    let snake = [];
    let food = { x: 8, y: 10 };
    let direction = 'right';
    let nextDirection = 'right';
    let score = 0;
    let gameOver = false;
    let winFlag = false;
    let gameInterval = null;
    const BASE_SPEED = 140;        // мс

    // Инициализация / сброс
    function resetGame() {
      // Останавливаем предыдущий интервал
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      gameOver = false;
      winFlag = false;
      scoreSpan.textContent = '0';
      statusDiv.textContent = 'Управляй змейкой — собирай яблоки';
      generateFood();
      drawGame();
      startLoop();
    }

    // Генерация еды в свободной клетке
    function generateFood() {
      const maxAttempts = 500;
      for (let i = 0; i < maxAttempts; i++) {
        const fx = Math.floor(Math.random() * GRID_SIZE);
        const fy = Math.floor(Math.random() * GRID_SIZE);
        if (!snake.some(seg => seg.x === fx && seg.y === fy)) {
          food = { x: fx, y: fy };
          return;
        }
      }
      // Если не нашли (почти победа) — проверяем все клетки
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (!snake.some(seg => seg.x === x && seg.y === y)) {
            food = { x, y };
            return;
          }
        }
      }
      // Поле заполнено — победа
      winFlag = true;
      gameOver = true;
      statusDiv.textContent = '🎉 Победа! Ты заполнил всё поле!';
    }

    // Отрисовка
    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Фон с сеткой
      ctx.fillStyle = '#0b141c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#1e3347';
      ctx.lineWidth = 0.8;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.strokeStyle = '#1e3347';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Еда (яблоко)
      ctx.shadowColor = '#ff5e5e';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff3a3a';
      ctx.beginPath();
      const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
      ctx.arc(fx, fy, CELL_SIZE * 0.38, 0, Math.PI * 2);
      ctx.fill();
      // Блик
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffb3b3';
      ctx.beginPath();
      ctx.arc(fx - 4, fy - 4, CELL_SIZE * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // Змейка
      snake.forEach((seg, idx) => {
        const isHead = idx === 0;
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const padding = isHead ? 2 : 3;
        const radius = isHead ? 8 : 6;

        // Градиент для сегментов
        const gradient = ctx.createRadialGradient(
          x + CELL_SIZE/2, y + CELL_SIZE/2, 2,
          x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE/1.5
        );
        if (isHead) {
          gradient.addColorStop(0, '#b0f0b0');
          gradient.addColorStop(0.7, '#3ba33b');
          gradient.addColorStop(1, '#1e6b1e');
        } else {
          gradient.addColorStop(0, '#7ed37e');
          gradient.addColorStop(0.6, '#2d8a2d');
          gradient.addColorStop(1, '#145214');
        }

        ctx.shadowColor = isHead ? '#aaffaa' : '#2e8b2e';
        ctx.shadowBlur = isHead ? 16 : 8;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x + padding, y + padding, CELL_SIZE - padding*2, CELL_SIZE - padding*2, radius);
        ctx.fill();

        // Глаза у головы
        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE*0.35, y + CELL_SIZE*0.35, CELL_SIZE*0.12, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE*0.65, y + CELL_SIZE*0.35, CELL_SIZE*0.12, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#0a0a0a';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE*0.35, y + CELL_SIZE*0.35, CELL_SIZE*0.06, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE*0.65, y + CELL_SIZE*0.35, CELL_SIZE*0.06, 0, Math.PI*2);
          ctx.fill();
        }
      });
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // Если игра окончена — затемнение и текст
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 32px "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 16;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const msg = winFlag ? '🏆 ПОБЕДА!' : '💀 ИГРА ОКОНЧЕНА';
        ctx.fillText(msg, canvas.width/2, canvas.height/2 - 20);
        ctx.font = '20px "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#cce6ff';
        ctx.fillText('Нажми «Заново»', canvas.width/2, canvas.height/2 + 40);
        ctx.shadowBlur = 0;
      }
    }

    // Обновление состояния игры (шаг)
    function stepGame() {
      if (gameOver) return;

      // Применяем отложенное направление
      direction = nextDirection;

      // Вычисляем новую голову
      const head = snake[0];
      let newHead = { ...head };

      switch (direction) {
        case 'right': newHead.x += 1; break;
        case 'left':  newHead.x -= 1; break;
        case 'up':    newHead.y -= 1; break;
        case 'down':  newHead.y += 1; break;
      }

      // Проверка выхода за границы
      if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
        gameOver = true;
        statusDiv.textContent = '💥 Удар в стену!';
        drawGame();
        return;
      }

      // Проверка столкновения с телом (кроме хвоста, который удалим)
      const willEat = (newHead.x === food.x && newHead.y === food.y);
      const snakeWithoutTail = willEat ? snake : snake.slice(0, -1);
      if (snakeWithoutTail.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        gameOver = true;
        statusDiv.textContent = '🌀 Столкновение с собой!';
        drawGame();
        return;
      }

      // Двигаем змейку
      snake.unshift(newHead);
      if (!willEat) {
        snake.pop();
      } else {
        // Съели яблоко
        score++;
        scoreSpan.textContent = score;
        statusDiv.textContent = '🍎 +1';
        generateFood();
        if (gameOver) { // если поле заполнено (winFlag)
          drawGame();
          return;
        }
      }

      drawGame();
    }

    // Запуск игрового цикла
    function startLoop() {
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        stepGame();
      }, BASE_SPEED);
    }

    // Смена направления с защитой от разворота на 180°
    function setDirection(newDir) {
      if (gameOver) return;
      const opposite = {
        'up': 'down',
        'down': 'up',
        'left': 'right',
        'right': 'left'
      };
      // Нельзя менять направление на противоположное текущему (direction, а не nextDirection)
      if (opposite[newDir] === direction) return;
      nextDirection = newDir;
    }

    // Обработчики кнопок
    document.querySelectorAll('.arrow').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const dir = e.currentTarget.dataset.dir;
        setDirection(dir);
      });
    });

    // Клавиатура
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      e.preventDefault(); // чтобы страница не скроллилась
      if (key === 'ArrowUp' || key === 'ц' || key === 'w' || key === 'W') setDirection('up');
      else if (key === 'ArrowDown' || key === 'ы' || key === 's' || key === 'S') setDirection('down');
      else if (key === 'ArrowLeft' || key === 'ф' || key === 'a' || key === 'A') setDirection('left');
      else if (key === 'ArrowRight' || key === 'в' || key === 'd' || key === 'D') setDirection('right');
      else if (key === ' ') resetGame();
    });

    // Рестарт
    document.getElementById('restartButton').addEventListener('click', resetGame);

    // Полифилл для roundRect (для старых браузеров)
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };
    }

    // Старт
    resetGame();
  })();
</script>
</body>
</html>
