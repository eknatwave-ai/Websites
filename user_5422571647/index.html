<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка-лабиринт · с порталами</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 20% 10%,#1b2f44 0%,#0b1a2e 60%,#050b14 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',Roboto,system-ui,sans-serif;padding:16px;color:#ddf0ff}
.game-wrapper{background:rgba(18,30,41,.85);backdrop-filter:blur(8px);border-radius:48px;padding:26px 26px 30px;box-shadow:0 25px 50px rgba(0,0,0,.7),inset 0 1px 4px rgba(255,255,255,.08);border:1px solid #3e5e7a;max-width:560px;width:100%}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 6px;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#0f1c26;padding:8px 18px;border-radius:60px;box-shadow:inset 0 4px 6px rgba(0,0,0,.6),0 2px 4px rgba(255,255,255,.05);color:#b9e6ff;font-weight:600;font-size:1.05rem;letter-spacing:.5px;border:1px solid #2e4b62;display:flex;align-items:center;gap:6px}
.stat span{color:#f5e56b;font-weight:800;text-shadow:0 0 8px #f5e56b80}
.stat.best span{color:#7ee0ff;text-shadow:0 0 8px #7ee0ff80}
.stat.lvl span{color:#ffb86b;text-shadow:0 0 8px #ffb86b80}
.restart-btn{background:#1e3347;border:none;border-radius:40px;padding:10px 22px;font-size:1rem;font-weight:600;color:#ddf0ff;cursor:pointer;box-shadow:0 6px 0 #0a121c,0 8px 12px rgba(0,0,0,.4);transition:all .08s ease;border:1px solid #3f637e;letter-spacing:.5px}
.restart-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0a121c,0 5px 10px rgba(0,0,0,.5)}
.restart-btn:hover{background:#264a64;color:#fff}
.canvas-wrap{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 0 0 2px #1e3a4e,0 20px 30px -5px #000}
canvas{display:block;width:100%;height:auto;max-width:500px;aspect-ratio:1/1;background:#0b141c;margin:0 auto}
.controls{display:flex;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap}
.arrow{background:#1b2d3b;border:none;width:66px;height:66px;border-radius:26px;font-size:2rem;font-weight:700;color:#b1d9f0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #0b131b,0 10px 16px rgba(0,0,0,.5);cursor:pointer;transition:all .06s ease;border:1px solid #3b5e78;user-select:none}
.arrow:active{transform:translateY(6px);box-shadow:0 2px 0 #0b131b,0 6px 12px rgba(0,0,0,.5)}
.arrow:hover{background:#254b62;color:#fff}
.status{text-align:center;margin-top:14px;font-size:1.1rem;font-weight:500;color:#aacce4;text-shadow:0 2px 4px #000;min-height:1.8rem;letter-spacing:.3px}
.hint{text-align:center;margin-top:6px;font-size:.85rem;color:#6f8ba3}
.best-setter{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.best-setter label{font-size:.9rem;color:#8fb0c8;letter-spacing:.3px}
.best-setter input{background:#0f1c26;border:1px solid #2e4b62;border-radius:30px;padding:8px 14px;color:#ddf0ff;font-size:.95rem;width:90px;text-align:center;font-weight:600;outline:none;box-shadow:inset 0 3px 6px rgba(0,0,0,.5);transition:border-color .15s}
.best-setter input:focus{border-color:#7ee0ff;box-shadow:inset 0 3px 6px rgba(0,0,0,.5),0 0 8px #7ee0ff60}
.best-setter button{background:#1e3347;border:1px solid #3f637e;border-radius:30px;padding:8px 18px;color:#ddf0ff;font-size:.9rem;font-weight:600;cursor:pointer;box-shadow:0 4px 0 #0a121c;transition:all .08s ease;letter-spacing:.3px}
.best-setter button:hover{background:#264a64;color:#fff}
.best-setter button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a121c}
.best-panel{margin-top:16px;background:linear-gradient(135deg,#0f1c26 0%,#132a3d 100%);border:1px solid #2e4b62;border-radius:24px;padding:16px 20px;box-shadow:inset 0 3px 8px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3)}
.best-panel-title{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem;font-weight:700;color:#7ee0ff;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;text-shadow:0 0 10px #7ee0ff60}
.best-panel-title::before,.best-panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#3e5e7a,transparent)}
.best-panel-value{text-align:center;font-size:2.6rem;font-weight:900;color:#f5e56b;text-shadow:0 0 20px #f5e56b80,0 4px 8px #000;letter-spacing:2px;line-height:1;margin-bottom:6px}
.best-panel-sub{text-align:center;font-size:.8rem;color:#6f8ba3;letter-spacing:.5px}
.best-panel-sub span{color:#aacce4;font-weight:600}
.portal-info{text-align:center;margin-top:10px;font-size:.85rem;color:#b48cff;letter-spacing:.3px;text-shadow:0 0 8px #b48cff60}
@media(max-width:480px){.game-wrapper{padding:16px;border-radius:32px}.arrow{width:56px;height:56px;font-size:1.6rem;border-radius:22px}.stat{font-size:.9rem;padding:6px 12px}.restart-btn{padding:8px 16px;font-size:.9rem}.best-setter input{width:70px;padding:6px 10px;font-size:.85rem}.best-setter button{padding:6px 14px;font-size:.85rem}.best-panel-value{font-size:2rem}.best-panel{padding:12px 16px}}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="header">
<div class="stats">
<div class="stat">🍎 <span id="scoreDisplay">0</span></div>
<div class="stat best">🏆 <span id="bestDisplay">0</span></div>
<div class="stat lvl">⚡ <span id="levelDisplay">1</span></div>
</div>
<button class="restart-btn" id="restartButton">⟳ Заново</button>
</div>
<div class="canvas-wrap"><canvas id="gameCanvas" width="500" height="500"></canvas></div>
<div class="controls">
<button class="arrow" data-dir="up">▲</button>
<button class="arrow" data-dir="left">◀</button>
<button class="arrow" data-dir="down">▼</button>
<button class="arrow" data-dir="right">▶</button>
</div>
<div class="status" id="statusMessage">Управляй змейкой — собирай яблоки</div>
<div class="portal-info">🌀 Портал: войди в фиолетовый круг — выйдешь из парного</div>
<div class="best-panel">
<div class="best-panel-title">Лучший результат</div>
<div class="best-panel-value" id="bestPanelValue">0</div>
<div class="best-panel-sub">Текущий рекорд: <span id="bestPanelSub">0</span> очков</div>
</div>
<div class="best-setter">
<label for="bestInput">🏆 Установить рекорд:</label>
<input type="number" id="bestInput" min="0" placeholder="0">
<button id="setBestButton">Сохранить</button>
</div>
<div class="hint">WASD / стрелки · пробел — рестарт · P — пауза</div>
</div>
<script>
(function(){
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreSpan=document.getElementById('scoreDisplay');
const bestSpan=document.getElementById('bestDisplay');
const levelSpan=document.getElementById('levelDisplay');
const statusDiv=document.getElementById('statusMessage');
const bestInput=document.getElementById('bestInput');
const setBestButton=document.getElementById('setBestButton');
const bestPanelValue=document.getElementById('bestPanelValue');
const bestPanelSub=document.getElementById('bestPanelSub');
const GRID=20,CELL=canvas.width/GRID;
let snake=[],food={x:8,y:10},bonus=null,bonusTimer=0,superFood=null,superTimer=0;
let portals=[];
let direction='right',nextDirection='right';
let score=0,best=+(localStorage.getItem('snakeBest')||0),level=1;
let gameOver=false,winFlag=false,paused=false;
let gameInterval=null,particles=[];
const BASE_SPEED=150;
bestSpan.textContent=best;
bestInput.value=best;
bestPanelValue.textContent=best;
bestPanelSub.textContent=best;

function updateBestUI(){
  bestSpan.textContent=best;
  bestInput.value=best;
  bestPanelValue.textContent=best;
  bestPanelSub.textContent=best;
}

function resetGame(){
  if(gameInterval){clearInterval(gameInterval);gameInterval=null}
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  direction='right';nextDirection='right';
  score=0;level=1;gameOver=false;winFlag=false;paused=false;
  particles=[];bonus=null;bonusTimer=0;superFood=null;superTimer=0;
  portals=[];
  scoreSpan.textContent='0';levelSpan.textContent='1';
  statusDiv.textContent='Управляй змейкой — собирай яблоки';
  generateFood();
  spawnPortals();
  drawGame();startLoop();
}

function isOccupied(x,y){
  if(snake.some(s=>s.x===x&&s.y===y))return true;
  if(food&&food.x===x&&food.y===y)return true;
  if(bonus&&bonus.x===x&&bonus.y===y)return true;
  if(superFood&&superFood.x===x&&superFood.y===y)return true;
  if(portals.some(p=>p.x===x&&p.y===y))return true;
  return false;
}

function generateFood(){
  for(let i=0;i<500;i++){
    const fx=Math.floor(Math.random()*GRID),fy=Math.floor(Math.random()*GRID);
    if(!isOccupied(fx,fy)){food={x:fx,y:fy};return}
  }
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(!isOccupied(x,y)){food={x,y};return}
  }
  winFlag=true;gameOver=true;statusDiv.textContent='🎉 Победа! Ты заполнил всё поле!';
}

function spawnPortals(){
  portals=[];
  const count=2;
  for(let i=0;i<count;i++){
    let placed=false;
    for(let t=0;t<300&&!placed;t++){
      const px=Math.floor(Math.random()*GRID),py=Math.floor(Math.random()*GRID);
      if(!isOccupied(px,py)){
        portals.push({x:px,y:py,id:i});
        placed=true;
      }
    }
  }
}

function spawnBonus(){
  for(let i=0;i<200;i++){
    const bx=Math.floor(Math.random()*GRID),by=Math.floor(Math.random()*GRID);
    if(!isOccupied(bx,by)){bonus={x:bx,y:by};bonusTimer=60;return}
  }
}

function spawnSuperFood(){
  for(let i=0;i<200;i++){
    const sx=Math.floor(Math.random()*GRID),sy=Math.floor(Math.random()*GRID);
    if(!isOccupied(sx,sy)){superFood={x:sx,y:sy};superTimer=90;return}
  }
}

function addParticles(x,y,color,count){
  const n=count||12;
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,color});
  }
}

function drawGame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0b141c';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#1e3347';ctx.lineWidth=.8;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();
  }
  const t=Date.now();
  portals.forEach(p=>{
    const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2;
    const pulse=1+Math.sin(t/150+p.id*Math.PI)*.12;
    const rot=t/500*(p.id?-1:1);
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(rot);
    ctx.shadowColor='#b48cff';ctx.shadowBlur=20;
    const g=ctx.createRadialGradient(0,0,2,0,0,CELL*.55);
    g.addColorStop(0,'#ffffff');
    g.addColorStop(.35,'#d0a8ff');
    g.addColorStop(.7,'#7a3fd0');
    g.addColorStop(1,'#2a0a50');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,CELL*.42*pulse,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e0c0ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,CELL*.42*pulse,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(-rot*1.6);
    ctx.strokeStyle='rgba(220,180,255,.85)';ctx.lineWidth=1.6;
    ctx.beginPath();
    for(let i=0;i<3;i++){
      const a=i*Math.PI*2/3;
      ctx.moveTo(Math.cos(a)*CELL*.28,Math.sin(a)*CELL*.28);
      ctx.lineTo(Math.cos(a+Math.PI*2/3)*CELL*.28,Math.sin(a+Math.PI*2/3)*CELL*.28);
    }
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  });
  const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
  ctx.shadowColor='#ff5e5e';ctx.shadowBlur=14;
  ctx.fillStyle='#ff3a3a';ctx.beginPath();ctx.arc(fx,fy,CELL*.38,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=6;ctx.fillStyle='#ffb3b3';ctx.beginPath();ctx.arc(fx-4,fy-4,CELL*.12,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  if(bonus){
    const bx=bonus.x*CELL+CELL/2,by=bonus.y*CELL+CELL/2;
    const pulse=1+Math.sin(Date.now()/120)*.15;
    ctx.shadowColor='#ffd700';ctx.shadowBlur=18;
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(bx,by,CELL*.35*pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff8b0';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('★',bx,by+1);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  if(superFood){
    const sx=superFood.x*CELL+CELL/2,sy=superFood.y*CELL+CELL/2;
    const pulse=1+Math.sin(Date.now()/90)*.2;
    const rot=Date.now()/400;
    ctx.save();
    ctx.translate(sx,sy);ctx.rotate(rot);
    ctx.shadowColor='#ff66ff';ctx.shadowBlur=22;
    const g=ctx.createRadialGradient(0,0,2,0,0,CELL*.55);
    g.addColorStop(0,'#ffffff');g.addColorStop(.4,'#ff88ff');g.addColorStop(1,'#a020c0');
    ctx.fillStyle=g;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+i*Math.PI*2/5;
      const r1=CELL*.5*pulse,r2=CELL*.22*pulse;
      ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a+Math.PI/5)*r2,Math.sin(a+Math.PI/5)*r2);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  snake.forEach((seg,idx)=>{
    const isHead=idx===0;
    const x=seg.x*CELL,y=seg.y*CELL;
    const pad=isHead?2:3,rad=isHead?8:6;
    const g=ctx.createRadialGradient(x+CELL/2,y+CELL/2,2,x+CELL/2,y+CELL/2,CELL/1.5);
    if(isHead){g.addColorStop(0,'#b0f0b0');g.addColorStop(.7,'#3ba33b');g.addColorStop(1,'#1e6b1e')}
    else{g.addColorStop(0,'#7ed37e');g.addColorStop(.6,'#2d8a2d');g.addColorStop(1,'#145214')}
    ctx.shadowColor=isHead?'#aaffaa':'#2e8b2e';ctx.shadowBlur=isHead?16:8;
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2,rad);ctx.fill();
    if(isHead){
      ctx.shadowBlur=0;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x+CELL*.35,y+CELL*.35,CELL*.12,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+CELL*.65,y+CELL*.35,CELL*.12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0a0a0a';
      ctx.beginPath();ctx.arc(x+CELL*.35,y+CELL*.35,CELL*.06,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+CELL*.65,y+CELL*.35,CELL*.06,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(gameOver||paused){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font='bold 32px "Segoe UI",Roboto,sans-serif';
    ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=16;
    ctx.textAlign='center';ctx.textBaseline='middle';
    let msg='💀 ИГРА ОКОНЧЕНА';
    if(winFlag)msg='🏆 ПОБЕДА!';
    else if(paused)msg='⏸ ПАУЗА';
    ctx.fillText(msg,canvas.width/2,canvas.height/2-20);
    ctx.font='18px "Segoe UI",Roboto,sans-serif';
    ctx.fillStyle='#cce6ff';
    ctx.fillText(paused?'Нажми P чтобы продолжить':'Нажми «Заново»',canvas.width/2,canvas.height/2+40);
    ctx.shadowBlur=0;
  }
}

function growSnake(count){
  const tail=snake[snake.length-1];
  for(let i=0;i<count;i++){
    snake.push({x:tail.x,y:tail.y});
  }
}

function stepGame(){
  if(gameOver||paused)return;
  direction=nextDirection;
  const head=snake[0];let nh={...head};
  switch(direction){
    case'right':nh.x++;break;
    case'left':nh.x--;break;
    case'up':nh.y--;break;
    case'down':nh.y++;break;
  }
  let teleported=false;
  const portalHit=portals.find(p=>p.x===nh.x&&p.y===nh.y);
  if(portalHit){
    const other=portals.find(p=>p.id!==portalHit.id);
    if(other){
      addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#b48cff',16);
      nh={x:other.x,y:other.y};
      addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#e0c0ff',16);
      teleported=true;
      statusDiv.textContent='🌀 Телепорт!';
    }
  }
  if(nh.x<0||nh.x>=GRID||nh.y<0||nh.y>=GRID){
    gameOver=true;statusDiv.textContent='💥 Удар в стену!';
    addParticles(head.x*CELL+CELL/2,head.y*CELL+CELL/2,'#ff5e5e');
    if(score>best){best=score;localStorage.setItem('snakeBest',best);updateBestUI()}
    drawGame();return;
  }
  const willEat=(nh.x===food.x&&nh.y===food.y);
  const willBonus=(bonus&&nh.x===bonus.x&&nh.y===bonus.y);
  const willSuper=(superFood&&nh.x===superFood.x&&nh.y===superFood.y);
  const willGrow=willEat||willBonus||willSuper;
  const body=willGrow?snake:snake.slice(0,-1);
  if(body.some(s=>s.x===nh.x&&s.y===nh.y)){
    gameOver=true;statusDiv.textContent='🌀 Столкновение с собой!';
    addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#ff5e5e');
    if(score>best){best=score;localStorage.setItem('snakeBest',best);updateBestUI()}
    drawGame();return;
  }
  snake.unshift(nh);
  if(willEat){
    const growCount=snake.length-1;
    growSnake(growCount);
    score++;scoreSpan.textContent=score;
    addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#ff5e5e',20);
    statusDiv.textContent='🍎 Яблоко! Змейка удвоена! +1';
    const newLevel=Math.floor(score/5)+1;
    if(newLevel>level){level=newLevel;levelSpan.textContent=level;statusDiv.textContent='⚡ Уровень '+level+'!';restartLoop()}
    if(score%3===0&&!bonus)spawnBonus();
    if(score%7===0&&!superFood)spawnSuperFood();
    generateFood();
    if(gameOver){drawGame();return}
  }else if(willBonus){
    score+=5;scoreSpan.textContent=score;
    addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#ffd700');
    statusDiv.textContent='⭐ Бонус +5!';
    bonus=null;bonusTimer=0;
    const newLevel=Math.floor(score/5)+1;
    if(newLevel>level){level=newLevel;levelSpan.textContent=level;restartLoop()}
  }else if(willSuper){
    const growCount=snake.length;
    growSnake(growCount);
    score+=10;scoreSpan.textContent=score;
    addParticles(nh.x*CELL+CELL/2,nh.y*CELL+CELL/2,'#ff88ff',24);
    statusDiv.textContent='💜 СУПЕР-ЯБЛОКО! Змейка удвоена! +10';
    superFood=null;superTimer=0;
    const newLevel=Math.floor(score/5)+1;
    if(newLevel>level){level=newLevel;levelSpan.textContent=level;restartLoop()}
  }else{
    snake.pop();
  }
  if(bonus){bonusTimer--;if(bonusTimer<=0)bonus=null}
  if(superFood){superTimer--;if(superTimer<=0)superFood=null}
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.03;return p.life>0;
  });
  drawGame();
}

function startLoop(){
  if(gameInterval)clearInterval(gameInterval);
  const speed=Math.max(60,BASE_SPEED-(level-1)*12);
  gameInterval=setInterval(stepGame,speed);
}
function restartLoop(){startLoop()}

function setDirection(nd){
  if(gameOver||paused)return;
  const opp={up:'down',down:'up',left:'right',right:'left'};
  if(opp[nd]===direction)return;
  nextDirection=nd;
}

document.querySelectorAll('.arrow').forEach(btn=>{
  btn.addEventListener('click',e=>setDirection(e.currentTarget.dataset.dir));
});

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  if(k==='ArrowUp'||k==='ц'||k==='w'||k==='W')setDirection('up');
  else if(k==='ArrowDown'||k==='ы'||k==='s'||k==='S')setDirection('down');
  else if(k==='ArrowLeft'||k==='ф'||k==='a'||k==='A')setDirection('left');
  else if(k==='ArrowRight'||k==='в'||k==='d'||k==='D')setDirection('right');
  else if(k===' ')resetGame();
  else if(k==='p'||k==='P'||k==='з'||k==='З'){
    if(!gameOver){paused=!paused;statusDiv.textContent=paused?'⏸ Пауза':'▶ Продолжаем';drawGame()}
  }
});

document.getElementById('restartButton').addEventListener('click',resetGame);

setBestButton.addEventListener('click',()=>{
  const val=parseInt(bestInput.value,10);
  if(isNaN(val)||val<0){statusDiv.textContent='⚠ Введи корректное число';return}
  best=val;localStorage.setItem('snakeBest',best);updateBestUI();
  statusDiv.textContent='🏆 Рекорд установлен: '+best;
});

bestInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();setBestButton.click()}
});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(w<2*r)r=w/2;if(h<2*r)r=h/2;
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);return this;
  };
}

resetGame();
})();
</script>
