<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06040f">
<title>NEON BREAKER — мини-арканоид</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06040f;color:#f2e9ff;
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;user-select:none;-webkit-user-select:none;
    touch-action:none}
  #hd{position:fixed;top:0;left:0;right:0;height:44px;z-index:5;display:flex;align-items:center;
    gap:10px;padding:0 12px;background:linear-gradient(180deg,#140b2c,#0a0518);
    border-bottom:1px solid #3a2460;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.1em}
  #hd .b{font-weight:bold;color:#e9d5ff;font-size:12px;letter-spacing:.14em;
    text-shadow:0 0 12px #a855f7aa;white-space:nowrap}
  #hd .b i{font-style:normal;color:#7ef0ff;text-shadow:0 0 12px #22d3ee99}
  .hs{display:flex;gap:9px;margin-left:auto;align-items:center;color:#8b6fb0;white-space:nowrap}
  .hs b{color:#7ef0ff;font-size:13px;text-shadow:0 0 8px #22d3ee66}
  #lives{display:flex;gap:4px}
  .lf{width:9px;height:9px;background:#ff5a9a;transform:rotate(45deg);border-radius:2px;
    box-shadow:0 0 6px #ff5a9a99}
  canvas{position:fixed;top:44px;left:0;bottom:0;display:block;cursor:crosshair}
  #ov{position:fixed;top:44px;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;
    justify-content:center;padding:16px;overflow:auto;
    background:radial-gradient(circle at 50% 45%,#180d30ee,#05030ccc 70%);
    opacity:0;pointer-events:none;transition:opacity .25s}
  #ov.show{opacity:1;pointer-events:auto}
  .p{width:100%;max-width:430px;text-align:center;padding:24px 20px;border:1px solid #4c2f7a;
    border-radius:16px;background:#0b0618ee;box-shadow:0 0 60px #a855f733,inset 0 0 40px #6d28d911}
  .p h1{margin:0 0 8px;font-size:clamp(21px,6vw,34px);letter-spacing:.18em;color:#e9d5ff;
    text-shadow:0 0 18px #c084fcaa,0 0 44px #7c3aed88}
  .p p{margin:9px 0;font-size:13px;line-height:1.65;color:#c3aee0}
  .p p.big{font-size:26px;color:#7ef0ff;text-shadow:0 0 14px #22d3ee66;margin:8px 0}
  button{margin-top:14px;padding:12px 34px;border:0;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase;
    color:#180330;background:linear-gradient(180deg,#e9d5ff,#a855f7);
    box-shadow:0 0 26px #a855f766;transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-2px);box-shadow:0 0 40px #c084fcaa}
  button:active{transform:translateY(1px)}
  .hint{font-size:10.5px;color:#5c4a7a;line-height:1.9;margin-top:12px;letter-spacing:.05em}
  .lg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
  .lg span{border:1px solid #33224f;border-radius:8px;padding:5px 9px;font-size:10px;color:#b79ce0;
    background:#100a1e;letter-spacing:.05em}
</style>
</head>
<body>
<header id="hd">
  <div class="b">NEON<i>BREAKER</i></div>
  <div class="hs">
    <span>ОЧКИ <b id="score">0</b></span>
    <span>УР <b id="level">1</b></span>
    <span id="lives"></span>
  </div>
</header>

<canvas id="c"></canvas>

<div id="ov" class="show">
  <div class="p">
    <h1>NEON BREAKER</h1>
    <p id="ovText">Мини-арканоид: разбей все неоновые блоки, лови усилители и доберись до 6-го уровня.</p>
    <button id="ovBtn">Играть</button>
    <div class="lg">
      <span style="color:#7ef0ff">↔ широкая</span>
      <span style="color:#c4a7ff">3 тройной мяч</span>
      <span style="color:#34d399">≈ замедление</span>
      <span style="color:#fbbf24">✚ жизнь</span>
    </div>
    <p class="hint">Мышь / палец / ← → / A D — платформа<br>
    Пробел — запуск мяча · P — пауза · M — звук</p>
  </div>
</div>

<script>
(function(){
'use strict';

var HEAD = 44, TAU = Math.PI * 2;
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var scoreEl = document.getElementById('score');
var levelEl = document.getElementById('level');
var livesEl = document.getElementById('lives');
var ov = document.getElementById('ov');
var ovText = document.getElementById('ovText');
var ovBtn = document.getElementById('ovBtn');

var W = 320, H = 400, DPR = 1, SC = 1;

var S = { mode:'menu', score:0, best:0, lives:3, level:1, max:6,
          time:0, clearT:0, banner:'', bannerT:0, flash:0, shake:0 };

try {
  var bs = parseInt(localStorage.getItem('nbx_best') || '0', 10);
  if (bs > 0) S.best = bs;
} catch(e){}

var cols = 9, rows = 5, bw = 0, bh = 0, mx = 0, topY = 0;
var pad = { x:0, y:0, w:100, base:100, h:12 };
var balls = [], bricks = [], drops = [], parts = [], stars = [];
var wide = 0, slow = 0;
var keys = { l:false, r:false }, usePtr = false, ptrX = 0;
var muted = false, lastBeep = 0;

var PAL = [['#22d3ee','#0e7490'],['#a78bfa','#5b21b6'],['#f472b6','#9d174d'],
           ['#fbbf24','#b45309'],['#34d399','#047857'],['#60a5fa','#1d4ed8']];
var PTYPE = [
  { k:'wide',  c:'#7ef0ff', s:'\u2194' },
  { k:'multi', c:'#c4a7ff', s:'3' },
  { k:'slow',  c:'#34d399', s:'\u2248' },
  { k:'life',  c:'#fbbf24', s:'\u271a' }
];

function rnd(a,b){ return a + Math.random() * (b - a); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- ЗВУК ---------- */
var AC = null;
function ensureAC(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended'){ try { AC.resume(); } catch(e){} }
}
function beep(f, d, v, ty){
  if (muted || !AC) return;
  var now = performance.now();
  if (now - lastBeep < 18) return;
  lastBeep = now;
  try {
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = ty || 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.03, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch(e){}
}

/* ---------- РАЗМЕТКА ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(280, window.innerWidth);
  H = Math.max(320, window.innerHeight - HEAD);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = clamp(Math.min(W, H) / 520, 0.62, 1.3);
  pad.base = clamp(W * 0.2, 66, 150);
  pad.h = clamp(H * 0.02, 9, 16);
  pad.y = H - clamp(H * 0.1, 42, 86);
  pad.w = wide > 0 ? pad.base * 1.7 : pad.base;
  pad.x = clamp(pad.x, pad.w / 2, W - pad.w / 2);
  geom();
  layout();
  initStars();
}
function geom(){
  mx = Math.max(10, W * 0.05);
  bw = (W - 2 * mx) / cols;
  bh = clamp(bw * 0.5, 12, 30);
  var lim = H * 0.42;
  if (bh * rows > lim) bh = lim / rows;
  topY = clamp(H * 0.11, 54, 120);
}
function layout(){
  var gap = Math.max(2, bw * 0.06);
  for (var i = 0; i < bricks.length; i++){
    var k = bricks[i];
    k.x = mx + k.col * bw + gap / 2;
    k.y = topY + k.row * bh + gap / 2;
    k.w = bw - gap;
    k.h = bh - gap;
  }
}
function initStars(){
  stars = [];
  var n = Math.round(clamp(W * H / 17000, 26, 80));
  for (var i = 0; i < n; i++){
    stars.push({ x:Math.random()*W, y:Math.random()*H, s:rnd(0.6,2), z:rnd(0.2,1), t:Math.random()*TAU });
  }
}

/* ---------- УРОВНИ ---------- */
function buildLevel(n){
  bricks = [];
  cols = 9;
  rows = clamp(4 + Math.floor(n / 2), 4, 6);
  var p = (n - 1) % 6, mid = (cols - 1) / 2, rmid = (rows - 1) / 2;
  for (var r = 0; r < rows; r++){
    for (var c = 0; c < cols; c++){
      var on = 1;
      if (p === 1) on = ((r + c) % 2 === 0) ? 1 : 0;
      else if (p === 2) on = (Math.abs(c - mid) <= (rows - r)) ? 1 : 0;
      else if (p === 3) on = ((c + r) % 3 !== 2) ? 1 : 0;
      else if (p === 4) on = (Math.abs(c - mid) <= 1 || Math.abs(r - rmid) < 0.6) ? 1 : 0;
      else if (p === 5) on = (Math.random() < 0.86) ? 1 : 0;
      if (!on) continue;
      var hp = 1;
      if (n >= 3 && r < 1) hp = 2;
      if (n >= 5 && r < 2) hp = 2;
      if (n >= 6 && r === 0) hp = 3;
      bricks.push({ col:c, row:r, hp:hp, max:hp, x:0, y:0, w:0, h:0, f:0 });
    }
  }
  geom();
  layout();
}

/* ---------- МЯЧ ---------- */
function ballR(){ return clamp(6 * SC, 4, 9); }
function ballSpeed(){ return clamp(245 + S.level * 18, 245, 520) * SC; }

function attachBall(){
  pad.x = clamp(pad.x, pad.w / 2, W - pad.w / 2);
  balls = [{ x:pad.x, y:pad.y - pad.h/2 - ballR() - 2, r:ballR(),
             vx:0, vy:0, att:true, launch:1.7, trail:[] }];
}
function launch(){
  var n = 0;
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    if (!b.att) continue;
    var a = -Math.PI / 2 + rnd(-0.55, 0.55), sp = ballSpeed();
    b.vx = Math.cos(a) * sp;
    b.vy = Math.sin(a) * sp;
    b.att = false;
    b.trail.length = 0;
    n++;
  }
  if (n) beep(420, 0.07, 0.03, 'square');
  return n;
}
function multiBall(){
  var src = [];
  for (var i = 0; i < balls.length; i++) if (!balls[i].att) src.push(balls[i]);
  if (!src.length || balls.length > 8) return;
  for (var k = 0; k < src.length; k++){
    if (balls.length >= 10) break;
    var b = src[k];
    var sp = Math.hypot(b.vx, b.vy) || ballSpeed();
    var a = Math.atan2(b.vy, b.vx) + 0.5;
    balls.push({ x:b.x, y:b.y, r:b.r, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, att:false, trail:[] });
  }
}

/* ---------- ЭФФЕКТЫ ---------- */
function burst(x, y, color, n, spd){
  for (var i = 0; i < n; i++){
    var a = Math.random() * TAU, s = rnd(spd * 0.25, spd);
    parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                 life:rnd(0.25,0.65), max:0.65, c:color, sz:rnd(1.4,3.2) });
  }
  if (parts.length > 260) parts.splice(0, parts.length - 260);
}

/* ---------- БОНУСЫ ---------- */
function drop(x, y){
  var r = Math.random(), v;
  if (r < 0.30) v = 0;
  else if (r < 0.58) v = 1;
  else if (r < 0.86) v = 2;
  else v = 3;
  drops.push({ x:clamp(x, 16, W - 16), y:y, r:13 * SC, v:v, vy:135 * SC, tt:0 });
}
function applyPower(v, x, y){
  var t = PTYPE[v];
  beep(880, 0.14, 0.04, 'sine');
  burst(x, y, t.c, 16, 240);
  if (t.k === 'wide') wide = 15;
  else if (t.k === 'slow') slow = 9;
  else if (t.k === 'life'){ S.lives = Math.min(6, S.lives + 1); updateHUD(); }
  else multiBall();
}

/* ---------- HUD ---------- */
function updateHUD(){
  scoreEl.textContent = S.score;
  levelEl.textContent = S.level;
  var h = '';
  for (var i = 0; i < S.lives; i++) h += '<span class="lf"></span>';
  livesEl.innerHTML = h;
}

/* ---------- ПОТОК ИГРЫ ---------- */
function showOverlay(text, btn){
  ovText.innerHTML = text;
  ovBtn.textContent = btn;
  ov.classList.add('show');
}
function showMenu(){
  S.mode = 'menu';
  showOverlay('Мини-арканоид: разбей все неоновые блоки, лови усилители и доберись до 6-го уровня.' +
    '<br>Рекорд: <b style="color:#7ef0ff">' + S.best + '</b>', 'Играть');
}
function startGame(){
  S.score = 0; S.lives = 3; S.time = 0;
  drops = []; parts = []; wide = 0; slow = 0;
  ov.classList.remove('show');
  startLevel(1);
}
function startLevel(n){
  S.level = n;
  buildLevel(n);
  pad.x = W / 2;
  pad.w = pad.base;
  drops = []; parts = [];
  attachBall();
  S.mode = 'play';
  S.banner = 'УРОВЕНЬ ' + n;
  S.bannerT = 1.4;
  updateHUD();
}
function nextLevel(){
  if (S.level >= S.max){
    S.mode = 'win';
    saveBest();
    showOverlay('Все ' + S.max + ' уровней зачищены. Сетка стабильна!<br>' +
      '<span class="big">' + S.score + ' очков</span>', 'Ещё раз');
    return;
  }
  startLevel(S.level + 1);
}
function saveBest(){
  if (S.score > S.best){
    S.best = S.score;
    try { localStorage.setItem('nbx_best', String(S.best)); } catch(e){}
  }
}
function loseLife(){
  S.lives--;
  S.flash = 0.5;
  S.shake = 14;
  wide = 0; slow = 0;
  pad.w = pad.base;
  drops = [];
  beep(180, 0.35, 0.06, 'sawtooth');
  updateHUD();
  if (S.lives <= 0){
    S.mode = 'over';
    saveBest();
    showOverlay('Все мячи потеряны.<br><span class="big">' + S.score + ' очков</span>' +
      '<br>Рекорд: <b style="color:#7ef0ff">' + S.best + '</b>', 'Заново');
    return;
  }
  S.banner = 'МЯЧ ПОТЕРЯН · ОСТАЛОСЬ ' + S.lives;
  S.bannerT = 1.2;
  attachBall();
}
function pause(){
  if (S.mode !== 'play') return;
  S.mode = 'paused';
  showOverlay('Пауза.<br><span class="big">' + S.score + ' очков</span>' +
    '<br>Уровень <b>' + S.level + '</b> · Жизни <b>' + S.lives + '</b>', 'Продолжить');
}
function resume(){
  if (S.mode !== 'paused') return;
  S.mode = 'play';
  ov.classList.remove('show');
}

/* ---------- ФИЗИКА ---------- */
function hitBricks(b){
  for (var i = 0; i < bricks.length; i++){
    var k = bricks[i];
    if (k.hp <= 0) continue;
    var cx = k.x + k.w/2, cy = k.y + k.h/2;
    var dx = b.x - cx, dy = b.y - cy;
    var ox = (k.w/2 + b.r) - Math.abs(dx);
    var oy = (k.h/2 + b.r) - Math.abs(dy);
    if (ox <= 0 || oy <= 0) continue;

    if (ox < oy){ b.x += dx > 0 ? ox : -ox; b.vx = Math.abs(b.vx) * (dx > 0 ? 1 : -1); }
    else { b.y += dy > 0 ? oy : -oy; b.vy = Math.abs(b.vy) * (dy > 0 ? 1 : -1); }

    k.hp--; k.f = 0.15;
    if (k.hp <= 0){
      S.score += 10 + S.level * 2;
      burst(cx, cy, '#7ef0ff', 12, 250);
      beep(620, 0.08, 0.03, 'triangle');
      if (Math.random() < 0.16) drop(cx, cy);
      updateHUD();
    } else {
      burst(b.x, b.y, '#ffffff', 4, 120);
      beep(340, 0.05, 0.02, 'square');
    }
    return;
  }
}

function update(dt){
  S.time += dt;

  for (var i = 0; i < stars.length; i++){
    var st = stars[i];
    st.y += st.z * 10 * dt;
    if (st.y > H + 3){ st.y = -3; st.x = Math.random() * W; }
  }
  for (i = parts.length - 1; i >= 0; i--){
    var q = parts[i];
    q.life -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= Math.pow(0.1, dt); q.vy *= Math.pow(0.1, dt);
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (i = 0; i < bricks.length; i++) if (bricks[i].f > 0) bricks[i].f -= dt;
  if (S.bannerT > 0) S.bannerT -= dt;
  if (S.flash > 0) S.flash -= dt * 2;
  if (S.shake > 0){ S.shake *= Math.pow(0.004, dt); if (S.shake < 0.3) S.shake = 0; }

  if (S.mode === 'clear'){
    S.clearT -= dt;
    if (S.clearT <= 0) nextLevel();
    return;
  }
  if (S.mode !== 'play') return;

  if (wide > 0){ wide -= dt; if (wide <= 0){ wide = 0; pad.w = pad.base; } }
  if (slow > 0) slow -= dt;

  /* платформа */
  var tgtW = wide > 0 ? pad.base * 1.7 : pad.base;
  pad.w += (tgtW - pad.w) * Math.min(1, dt * 12);
  var px = pad.x;
  if (keys.l) pad.x -= 780 * SC * dt;
  else if (keys.r) pad.x += 780 * SC * dt;
  else if (usePtr) pad.x += (ptrX - pad.x) * Math.min(1, dt * 20);
  pad.x = clamp(pad.x, pad.w / 2, W - pad.w / 2);

  /* бонусы */
  for (i = drops.length - 1; i >= 0; i--){
    var d = drops[i];
    d.tt += dt;
    d.y += d.vy * dt;
    if (d.y - d.r > H + 20){ drops.splice(i, 1); continue; }
    if (d.y + d.r > pad.y - pad.h/2 && d.y - d.r < pad.y + pad.h/2 &&
        Math.abs(d.x - pad.x) < pad.w/2 + d.r){
      applyPower(d.v, d.x, d.y);
      drops.splice(i, 1);
    }
  }

  /* мячи */
  var target = ballSpeed() * (slow > 0 ? 0.62 : 1);
  var steps = clamp(Math.ceil(target * dt / 4), 1, 12);
  var sdt = dt / steps;

  for (i = 0; i < balls.length; i++){
    var b0 = balls[i];
    if (b0.att){
      b0.x = clamp(pad.x, b0.r, W - b0.r);
      b0.y = pad.y - pad.h/2 - b0.r - 2;
      b0.launch -= dt;
      if (b0.launch <= 0) launch();
    } else {
      var cur = Math.hypot(b0.vx, b0.vy);
      if (cur > 0){
        var k2 = 1 + (target / cur - 1) * Math.min(1, dt * 2);
        b0.vx *= k2; b0.vy *= k2;
      }
    }
  }

  for (var s = 0; s < steps; s++){
    for (var j = 0; j < balls.length; j++){
      var b = balls[j];
      if (b.att || b.dead) continue;
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;

      if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); }
      else if (b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy); }

      if (b.vy > 0 && b.y + b.r > pad.y - pad.h/2 && b.y - b.r < pad.y + pad.h/2 &&
          Math.abs(b.x - pad.x) < pad.w/2 + b.r){
        var rel = clamp((b.x - pad.x) / (pad.w/2), -1, 1);
        var ang = -Math.PI / 2 + rel * 1.05;
        var spd = Math.hypot(b.vx, b.vy) || target;
        b.vx = Math.cos(ang) * spd;
        b.vy = Math.sin(ang) * spd;
        if (b.vy > -70) b.vy = -70;
        b.y = pad.y - pad.h/2 - b.r - 1;
        burst(b.x, pad.y - pad.h/2, '#c084fc', 5, 150);
        beep(320, 0.06, 0.025, 'square');
      }

      hitBricks(b);
      if (b.y - b.r > H + 40) b.dead = true;
    }
  }

  for (i = balls.length - 1; i >= 0; i--){
    var bt = balls[i];
    if (bt.dead || bt.y - bt.r > H + 40){ balls.splice(i, 1); continue; }
    if (!bt.att){
      bt.trail.push(bt.x, bt.y);
      if (bt.trail.length > 16) bt.trail.splice(0, 2);
    }
  }

  for (i = bricks.length - 1; i >= 0; i--) if (bricks[i].hp <= 0) bricks.splice(i, 1);

  if (!balls.length && S.mode === 'play'){ loseLife(); return; }

  if (!bricks.length && S.mode === 'play'){
    S.mode = 'clear';
    S.clearT = 1.3;
    S.score += 50 * S.level;
    S.banner = 'УРОВЕНЬ ' + S.level + ' ПРОЙДЕН';
    S.bannerT = 1.3;
    beep(900, 0.18, 0.04, 'sine');
    updateHUD();
  }
}

/* ---------- ОТРИСОВКА ---------- */
function draw(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0724');
  g.addColorStop(1, '#05030e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    ctx.globalAlpha = 0.18 + 0.5 * s.z * (0.5 + 0.5 * Math.sin(S.time * 2 + s.t));
    ctx.fillStyle = s.z > 0.7 ? '#cfe9ff' : '#8f7fd0';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.restore();

  ctx.save();
  if (S.shake > 0.3) ctx.translate(rnd(-S.shake, S.shake) * 0.4, rnd(-S.shake, S.shake) * 0.4);

  /* блоки */
  for (i = 0; i < bricks.length; i++){
    var k = bricks[i], p = PAL[k.row % PAL.length], fl = k.f > 0;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = fl ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.07)';
    rr(k.x - 3, k.y - 3, k.w + 6, k.h + 6, 5);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    var lg = ctx.createLinearGradient(k.x, k.y, k.x, k.y + k.h);
    lg.addColorStop(0, fl ? '#ffffff' : p[0]);
    lg.addColorStop(1, fl ? '#ffffff' : p[1]);
    ctx.globalAlpha = (k.max > 1 && k.hp < k.max) ? 0.6 : 1;
    ctx.fillStyle = lg;
    rr(k.x, k.y, k.w, k.h, 4);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (k.max > 1 && k.w > 18){
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(k.x + 3, k.y + k.h - 4, k.w - 6, 2);
      ctx.fillStyle = p[0];
      ctx.fillRect(k.x + 3, k.y + k.h - 4, (k.w - 6) * (k.hp / k.max), 2);
    }
  }

  /* бонусы */
  for (i = 0; i < drops.length; i++){
    var d = drops[i], t = PTYPE[d.v];
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.tt * 3) * 0.25);
    ctx.globalCompositeOperation = 'lighter';
    var dg = ctx.createRadialGradient(0, 0, 0, 0, 0, d.r * 2);
    dg.addColorStop(0, t.c + 'bb');
    dg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(0, 0, d.r * 2, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0b0618';
    rr(-d.r, -d.r, d.r * 2, d.r * 2, 5); ctx.fill();
    ctx.strokeStyle = t.c; ctx.lineWidth = 2;
    rr(-d.r, -d.r, d.r * 2, d.r * 2, 5); ctx.stroke();
    ctx.fillStyle = t.c;
    ctx.font = 'bold ' + Math.round(d.r * 1.15) + 'px "Courier New",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.s, 0, 1);
    ctx.restore();
  }

  /* платформа */
  if (S.mode === 'play' || S.mode === 'paused' || S.mode === 'clear'){
    var pxx = pad.x - pad.w / 2, pyy = pad.y - pad.h / 2;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = wide > 0 ? 'rgba(126,240,255,0.3)' : 'rgba(168,85,247,0.28)';
    rr(pxx - 5, pyy - 5, pad.w + 10, pad.h + 10, 10);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    var pg = ctx.createLinearGradient(pxx, pyy, pxx, pyy + pad.h);
    pg.addColorStop(0, '#f3e9ff');
    pg.addColorStop(0.5, '#c084fc');
    pg.addColorStop(1, '#6d28d9');
    ctx.fillStyle = pg;
    rr(pxx, pyy, pad.w, pad.h, pad.h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1.2;
    rr(pxx + 0.5, pyy + 0.5, pad.w - 1, pad.h - 1, pad.h / 2);
    ctx.stroke();
  }

  /* мячи */
  for (i = 0; i < balls.length; i++){
    var b = balls[i];
    if (b.trail && b.trail.length > 3){
      ctx.globalCompositeOperation = 'lighter';
      for (var t2 = 0; t2 + 1 < b.trail.length; t2 += 2){
        var a2 = (t2 / b.trail.length) * 0.34;
        ctx.globalAlpha = a2;
        ctx.fillStyle = '#7ef0ff';
        ctx.beginPath();
        ctx.arc(b.trail[t2], b.trail[t2 + 1], b.r * (0.35 + a2), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalCompositeOperation = 'lighter';
    var bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.4);
    bg.addColorStop(0, 'rgba(150,245,255,0.9)');
    bg.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.4, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = b.att ? '#fff6cf' : '#eafcff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }

  /* частицы */
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < parts.length; i++){
    var q = parts[i], al = Math.max(0, q.life / q.max);
    ctx.globalAlpha = al;
    ctx.fillStyle = q.c;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.sz * (0.4 + al * 0.9), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  /* баннер */
  if (S.bannerT > 0){
    var f = Math.min(1, S.bannerT / 0.3) * Math.min(1, (1.5 - S.bannerT) / 0.15 + 1);
    ctx.save();
    ctx.globalAlpha = clamp(f, 0, 1);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.round(Math.min(30, W / 18)) + 'px "Courier New",monospace';
    ctx.fillStyle = '#e9d5ff';
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 24;
    ctx.fillText(S.banner, W / 2, H * 0.34);
    ctx.restore();
  }

  if (S.flash > 0){
    ctx.fillStyle = 'rgba(255,80,140,' + (S.flash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.35, W/2, H/2, Math.max(W,H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (muted){
    ctx.fillStyle = 'rgba(160,130,200,0.6)';
    ctx.font = '11px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('ЗВУК ВЫКЛ (M)', W / 2, H - 14);
  }
}

/* ---------- УПРАВЛЕНИЕ ---------- */
window.addEventListener('resize', function(){ resize(); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 140); });

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();
  if (k === 'arrowleft' || k === 'a' || k === 'ф'){ keys.l = true; usePtr = false; }
  if (k === 'arrowright' || k === 'd' || k === 'в'){ keys.r = true; usePtr = false; }
  if (k === 'm' || k === 'ь') muted = !muted;
  if (k === 'p' || k === 'escape' || k === 'з'){
    if (S.mode === 'play') pause();
    else if (S.mode === 'paused') resume();
  }
  if (k === ' ' || k === 'enter'){
    ensureAC();
    if (S.mode === 'paused'){ resume(); return; }
    if (S.mode === 'menu' || S.mode === 'over' || S.mode === 'win'){ startGame(); return; }
    launch();
  }
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a' || k === 'ф') keys.l = false;
  if (k === 'arrowright' || k === 'd' || k === 'в') keys.r = false;
});
window.addEventListener('blur', function(){
  keys.l = false; keys.r = false;
  if (S.mode === 'play') pause();
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden && S.mode === 'play') pause();
});

cv.addEventListener('pointerdown', function(e){
  ensureAC();
  ptrX = e.clientX;
  usePtr = true;
  if (S.mode === 'menu' || S.mode === 'over' || S.mode === 'win'){ startGame(); return; }
  if (S.mode === 'paused'){ resume(); return; }
  launch();
});
cv.addEventListener('pointermove', function(e){
  ptrX = e.clientX;
  if (e.pointerType === 'mouse') usePtr = true;
});

ovBtn.addEventListener('click', function(e){
  e.stopPropagation();
  ensureAC();
  if (S.mode === 'paused') resume();
  else startGame();
});

/* ---------- ЦИКЛ ---------- */
var last = performance.now();
function loop(now){
  var dt = (now - last) / 1000;
  last = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.045);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- СТАРТ ---------- */
resize();
buildLevel(1);
pad.x = W / 2;
attachBall();
updateHUD();
showMenu();
requestAnimationFrame(loop);

})();
</script>
